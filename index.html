<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adept Pro Track Mate</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:700;color:#2563eb}.container{max-width:1200px;margin:24px auto;padding:0 16px}.muted{color:#6b7280}.cards,.menu{display:grid;gap:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:24px 0}.menu{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card,.menu button{background:#fff;border:0;border-radius:12px;box-shadow:0 2px 8px #0000000d}.card{padding:20px}.card h3{margin:0 0 10px;font-size:15px}.number{font-size:32px;font-weight:700;color:#2563eb}.menu button{padding:22px;text-align:left;font-size:16px;cursor:pointer}.menu span{display:block;font-size:30px;margin-bottom:10px}.profile{display:flex;align-items:center;gap:8px}.modal-bg{position:fixed;inset:0;background:#0f172a59;z-index:10}.modal{position:fixed;z-index:11;top:3%;left:50%;transform:translateX(-50%);width:1050px;max-width:96%;max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}.field,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#6b7280;color:#fff}.light{background:#f3f4f6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.row{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.table-wrap{overflow:auto}.planning{width:100%;border-collapse:separate;border-spacing:0 8px}.planning th,.planning td{padding:12px 10px;text-align:left;white-space:nowrap}.planning th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280}.planning tbody tr{background:#fff;box-shadow:0 2px 8px #0000000d}.planning tbody td:first-child{border-radius:10px 0 0 10px}.planning tbody td:last-child{border-radius:0 10px 10px 0}.planning .entrant{font-weight:700}.planning .sub{display:block;font-size:12px;color:#6b7280;margin-top:3px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px}.ok{background:#dcfce7;color:#166534}.wait{background:#fee2e2;color:#991b1b}.planning-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:10px}.planning-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.planning-stat{padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb}.planning-stat strong{display:block;font-size:20px}.planning-stat span{font-size:12px;color:#6b7280}.planning-alert{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:12px 0;border:1px solid #fecaca;background:#fff1f2;border-radius:10px;color:#991b1b;font-weight:600}.planning-empty{padding:28px 16px;text-align:center;border:1px dashed #d1d5db;border-radius:10px;color:#6b7280;background:#f9fafb}@media(max-width:600px){header{padding:14px 16px}.logo{font-size:18px}.container{margin:18px auto}.cards{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr}.modal{top:2%;padding:16px}.filters,.grid2,.planning-stats{grid-template-columns:1fr}.planning-head{display:block}.planning{font-size:13px}.planning th,.planning td{padding:9px 7px}.profile span{font-size:14px}.planning tbody tr{box-shadow:none;border:1px solid #e5e7eb}.planning tbody td{white-space:normal}}
</style></head><body><header><div class="logo">Adept Pro Track Mate</div><div class="profile"><span id="profilLabel">Profil : Master du site</span><button class="btn light" id="btnProfil">Changer</button></div></header><main class="container"><h1>Tableau de bord</h1><p class="muted">Gestion des plannings, tuteurs, nouveaux entrants et agences</p><section class="cards"><div class="card"><h3>Nouveaux entrants</h3><div class="number" id="compteurEntrants">0</div></div><div class="card"><h3>Tuteurs</h3><div class="number" id="compteurTuteurs">0</div></div><div class="card"><h3>Agences</h3><div class="number">7</div></div><div class="card"><h3>Plannings</h3><div class="number" id="compteurPlannings">0</div></div></section><section class="menu"><button id="btnEntrants"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button><button id="btnTuteurs"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button><button id="btnAgences"><span>🏢</span><strong>Agences</strong><br>Voir les agences partenaires</button><button id="btnPlanning"><span>📅</span><strong>Planning</strong><br>Organiser et suivre les accompagnements</button></section></main><footer style="text-align:center;color:#9ca3af;padding:35px">Adept Pro Track Mate</footer><script>
const AGENCES=['Dol de Bretagne','Mont de Marsan','Tarascon','Fleury Mérogis','Noisy le Gd','St Pierre de Chandieu','Vitry-en-Artois'];const FONCTIONS=['Conducteur','Aide-livreur','Technicien de quai','Autre'];const couleurs={'Dol de Bretagne':'#dbeafe','Mont de Marsan':'#dcfce7','Tarascon':'#fef3c7','Fleury Mérogis':'#fce7f3','Noisy le Gd':'#ede9fe','St Pierre de Chandieu':'#ffedd5','Vitry-en-Artois':'#cffafe'};
function lire(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function sauver(k,v){localStorage.setItem(k,JSON.stringify(v))}function profil(){return(localStorage.getItem('profilActuel')||'master du site').toLowerCase().trim()}function estMaster(){return['master','master du site','master_site'].includes(profil())}function ouvrir(id,html){fermer(id);const bg=document.createElement('div');bg.id=id+'Bg';bg.className='modal-bg';bg.onclick=()=>fermer(id);document.body.appendChild(bg);const m=document.createElement('div');m.id=id;m.className='modal';m.innerHTML=html;document.body.appendChild(m);return m}function fermer(id){const m=document.getElementById(id),b=document.getElementById(id+'Bg');if(m)m.remove();if(b)b.remove()}function actualiser(){document.getElementById('compteurEntrants').textContent=lire('nouveauxEntrants').length;document.getElementById('compteurTuteurs').textContent=lire('tuteurs').length;document.getElementById('compteurPlannings').textContent=lire('affectationsTuteurs').length;document.getElementById('profilLabel').textContent='Profil : '+(estMaster()?'Master du site':profil());const bt=document.getElementById('btnTuteurs');if(bt)bt.style.display=estMaster()?'':'none'}
function choisirProfil(){ouvrir('profilModal','<h2>🔐 Choisir le profil</h2><p class="muted">Le profil Master autorise l’affectation des tuteurs.</p><div class="actions"><button class="btn success" id="pMaster">Master du site</button><button class="btn light" id="pAgence">Agence</button><button class="btn light" id="pTuteur">Tuteur</button></div><div class="actions"><button class="btn secondary" id="pClose">Fermer</button></div>');document.getElementById('pMaster').onclick=()=>setProfil('master du site');document.getElementById('pAgence').onclick=()=>setProfil('agence');document.getElementById('pTuteur').onclick=()=>setProfil('tuteur');document.getElementById('pClose').onclick=()=>fermer('profilModal')}function setProfil(p){localStorage.setItem('profilActuel',p);fermer('profilModal');actualiser()}
function afficherEntrants(){const e=lire('nouveauxEntrants'),a=lire('affectationsTuteurs');let h='<h2>👤 Nouveaux entrants</h2><p class="muted">Liste des entrants enregistrés.</p>';if(!e.length)h+='<div class="row">Aucun entrant enregistré.</div>';e.forEach((x,i)=>{const q=a.find(v=>v.entrantId===x.id);h+='<div class="row"><strong>'+x.nom+'</strong><p>📅 '+x.date+'<br>💼 '+x.fonction+'<br>🏢 '+x.agence+'<br>🎓 Tuteur : <strong>'+(q?q.tuteurNom:'Non affecté')+'</strong>'+(q?'<br>📆 '+q.dateDebut+' → '+q.dateFin:'')+'</p><button class="btn danger" data-del-entrant="'+i+'">🗑️ Supprimer</button></div>'});h+='<div class="actions"><button class="btn primary" id="addEntrantBtn">➕ Ajouter</button>'+(estMaster()?'<button class="btn success" id="affectBtn">🎓 Affecter un tuteur</button>':'')+'<button class="btn secondary" id="closeEntrants">Fermer</button></div>';ouvrir('entrantsModal',h);document.getElementById('addEntrantBtn').onclick=()=>{fermer('entrantsModal');ajouterEntrant()};if(estMaster())document.getElementById('affectBtn').onclick=()=>{fermer('entrantsModal');ouvrirAffectations()};document.getElementById('closeEntrants').onclick=()=>fermer('entrantsModal');document.querySelectorAll('[data-del-entrant]').forEach(b=>b.onclick=()=>supprimerEntrant(Number(b.dataset.delEntrant)))}
function ajouterEntrant(){const m=ouvrir('addEntrant','<h2>👤 Ajouter un nouvel entrant</h2><label>Nom et prénom</label><input id="enNom" class="field" placeholder="Nom et prénom"><br><br><label>Date d’entrée</label><input id="enDate" class="field" type="date"><br><br><label>Fonction</label><div id="enFonctions" class="actions"></div><label>Agence</label><div id="enAgences"></div><div class="actions"><button class="btn primary" id="saveEntrant">Ajouter</button><button class="btn secondary" id="cancelEntrant">Annuler</button></div>');FONCTIONS.forEach(x=>{const b=document.createElement('button');b.className='btn light';b.textContent=x;b.onclick=()=>{m.querySelectorAll('#enFonctions button').forEach(z=>z.style.background='');b.style.background='#bfdbfe';m.dataset.fonction=x};m.querySelector('#enFonctions').appendChild(b)});AGENCES.forEach(x=>{const b=document.createElement('button');b.className='btn light';b.style.display='block';b.style.width='100%';b.style.margin='6px 0';b.textContent=x;b.onclick=()=>{m.querySelectorAll('#enAgences button').forEach(z=>z.style.background='');b.style.background=couleurs[x]||'#e5e7eb';m.dataset.agence=x};m.querySelector('#enAgences').appendChild(b)});document.getElementById('saveEntrant').onclick=()=>{const nom=document.getElementById('enNom').value.trim(),date=document.getElementById('enDate').value;if(!nom||!date||!m.dataset.fonction||!m.dataset.agence)return alert('Renseignez le nom, la date, la fonction et l’agence.');const e=lire('nouveauxEntrants');e.push({id:String(Date.now()),nom,date,fonction:m.dataset.fonction,agence:m.dataset.agence});sauver('nouveauxEntrants',e);fermer('addEntrant');actualiser();afficherEntrants()};document.getElementById('cancelEntrant').onclick=()=>fermer('addEntrant')}
function supprimerEntrant(i){const e=lire('nouveauxEntrants');if(!confirm('Supprimer cet entrant ?'))return;const id=e[i]?.id;e.splice(i,1);sauver('nouveauxEntrants',e);if(id)sauver('affectationsTuteurs',lire('affectationsTuteurs').filter(a=>a.entrantId!==id));actualiser();afficherEntrants()}
function ouvrirTuteurs(){if(!estMaster())return alert('Accès réservé au Master du site.');let h='<h2>🎓 Gestion des tuteurs</h2><p class="muted">Ajoutez les tuteurs disponibles.</p><input id="tuNom" class="field" placeholder="Nom et prénom"><div class="actions"><button class="btn primary" id="addTuteur">➕ Ajouter le tuteur</button></div><hr><h3>Tuteurs enregistrés</h3>';const t=lire('tuteurs');if(!t.length)h+='<p>Aucun tuteur enregistré.</p>';t.forEach((x,i)=>{h+='<div class="row"><strong>👤 '+x.nom+'</strong><button class="btn danger" data-del-tuteur="'+i+'" style="float:right">🗑️</button></div>'});h+='<div class="actions"><button class="btn success" id="openAffect">🎓 Affecter un tuteur à un entrant</button><button class="btn secondary" id="closeTuteurs">Fermer</button></div>';ouvrir('tuteursModal',h);document.getElementById('addTuteur').onclick=ajouterTuteur;document.getElementById('openAffect').onclick=()=>{fermer('tuteursModal');ouvrirAffectations()};document.getElementById('closeTuteurs').onclick=()=>fermer('tuteursModal');document.querySelectorAll('[data-del-tuteur]').forEach(b=>b.onclick=()=>supprimerTuteur(Number(b.dataset.delTuteur)))}
function ajouterTuteur(){const n=document.getElementById('tuNom').value.trim();if(!n)return alert('Renseignez le nom.');const t=lire('tuteurs');if(t.some(x=>x.nom.toLowerCase()===n.toLowerCase()))return alert('Ce tuteur existe déjà.');t.push({id:String(Date.now()),nom:n});sauver('tuteurs',t);actualiser();ouvrirTuteurs()}function supprimerTuteur(i){const t=lire('tuteurs');if(!confirm('Supprimer ce tuteur ?'))return;t.splice(i,1);sauver('tuteurs',t);actualiser();ouvrirTuteurs()}
function ouvrirAffectations(){if(!estMaster())return alert('Accès réservé au Master du site.');const e=lire('nouveauxEntrants'),t=lire('tuteurs'),a=lire('affectationsTuteurs');let h='<h2>🎓 Affectation des tuteurs</h2><p class="muted">Seul le Master du site peut effectuer cette affectation.</p>';if(!e.length)h+='<div class="row">Aucun nouvel entrant.</div>';else if(!t.length)h+='<div class="row">Aucun tuteur enregistré. Ajoutez d’abord un tuteur.</div>';e.forEach(x=>{const q=a.find(v=>v.entrantId===x.id);h+='<div class="row"><strong>👤 '+x.nom+'</strong><p>'+x.date+' · '+x.agence+' · '+x.fonction+'</p><label>Tuteur</label><select id="sel-'+x.id+'" class="field"><option value="">-- Aucun tuteur --</option>'+t.map(z=>'<option value="'+z.id+'" '+(q&&q.tuteurId===z.id?'selected':'')+'>'+z.nom+'</option>').join('')+'</select><div class="grid2"><div><label>Début</label><input id="deb-'+x.id+'" class="field" type="date" value="'+(q?q.dateDebut:x.date)+'"></div><div><label>Fin</label><input id="fin-'+x.id+'" class="field" type="date" value="'+(q?q.dateFin:x.date)+'"></div></div><div class="actions"><button class="btn success" data-save-aff="'+x.id+'">💾 Enregistrer</button>'+(q?'<button class="btn danger" data-rem-aff="'+x.id+'">Retirer</button>':'')+'</div></div>'});h+='<div class="actions"><button class="btn secondary" id="closeAffect">Fermer</button></div>';ouvrir('affectationsModal',h);document.getElementById('closeAffect').onclick=()=>fermer('affectationsModal');document.querySelectorAll('[data-save-aff]').forEach(b=>b.onclick=()=>enregistrerAffectation(b.dataset.saveAff));document.querySelectorAll('[data-rem-aff]').forEach(b=>b.onclick=()=>retirerAffectation(b.dataset.remAff))}
function enregistrerAffectation(id){if(!estMaster())return alert('Accès réservé au Master du site.');const s=document.getElementById('sel-'+id),deb=document.getElementById('deb-'+id).value,fin=document.getElementById('fin-'+id).value;if(!s||!s.value)return retirerAffectation(id);if(!deb||!fin)return alert('Renseignez les dates.');if(fin<deb)return alert('La fin doit être postérieure ou égale au début.');const e=lire('nouveauxEntrants').find(x=>x.id===id),t=lire('tuteurs').find(x=>x.id===s.value);if(!e||!t)return alert('Entrant ou tuteur introuvable.');const a=lire('affectationsTuteurs').filter(x=>x.entrantId!==id);a.push({entrantId:id,tuteurId:t.id,tuteurNom:t.nom,dateDebut:deb,dateFin:fin,agence:e.agence});sauver('affectationsTuteurs',a);actualiser();ouvrirAffectations()}
function retirerAffectation(id){sauver('affectationsTuteurs',lire('affectationsTuteurs').filter(x=>x.entrantId!==id));actualiser();ouvrirAffectations()}
function ouvrirPlanning(){let h='<div class="planning-head"><div><h2 style="margin-bottom:6px">📅 Planning</h2><p class="muted" style="margin-top:0">Suivi visuel de tous les nouveaux entrants et de leur accompagnement.</p></div><span class="badge ok">Suivi en temps réel</span></div><div class="filters"><select id="filtreAgence" class="field"><option value="">Toutes les agences</option>'+AGENCES.map(x=>'<option>'+x+'</option>').join('')+'</select><select id="filtreTuteur" class="field"><option value="">Tous les tuteurs</option>'+lire('tuteurs').map(x=>'<option value="'+x.id+'">'+x.nom+'</option>').join('')+'</select></div><div id="planningStats" class="planning-stats"></div><div id="planningAlert"></div><div id="planningZone"></div><div class="actions"><button class="btn secondary" id="closePlanning">Fermer</button></div>';ouvrir('planningModal',h);document.getElementById('filtreAgence').onchange=rafraichirPlanning;document.getElementById('filtreTuteur').onchange=rafraichirPlanning;document.getElementById('closePlanning').onclick=()=>fermer('planningModal');rafraichirPlanning()}
function rafraichirPlanning(){const e=lire('nouveauxEntrants'),a=lire('affectationsTuteurs'),ag=document.getElementById('filtreAgence')?.value||'',tu=document.getElementById('filtreTuteur')?.value||'';const visibles=e.filter(x=>(!ag||x.agence===ag)&&(!tu||a.some(q=>q.entrantId===x.id&&q.tuteurId===tu)));const affectes=visibles.filter(x=>a.some(q=>q.entrantId===x.id));const nonAffectes=visibles.length-affectes.length;document.getElementById('planningStats').innerHTML='<div class="planning-stat"><strong>'+visibles.length+'</strong><span>Entrants affichés</span></div><div class="planning-stat"><strong>'+affectes.length+'</strong><span>Accompagnements planifiés</span></div><div class="planning-stat"><strong>'+nonAffectes+'</strong><span>À affecter</span></div>';document.getElementById('planningAlert').innerHTML=nonAffectes?'<div class="planning-alert">⚠️ '+nonAffectes+' entrant'+(nonAffectes>1?'s':'')+' n’est'+(nonAffectes>1?'':' pas')+' pas encore affecté'+(nonAffectes>1?'s':'')+' à un tuteur.</div>':'';let rows=visibles.map(x=>{const q=a.find(v=>v.entrantId===x.id);return '<tr><td><span class="entrant">'+x.nom+'</span><span class="sub">Entrée : '+x.date+'</span></td><td>'+x.agence+'</td><td>'+x.fonction+'</td><td>'+(q?'<span class="badge ok">🎓 '+q.tuteurNom+'</span>':'<span class="badge wait">⚠️ Non affecté</span>')+'</td><td>'+(q?'<strong>'+q.dateDebut+'</strong> → <strong>'+q.dateFin+'</strong>':'<span class="muted">À programmer</span>')+'</td></tr>'}).join('');document.getElementById('planningZone').innerHTML=rows?'<div class="table-wrap"><table class="planning"><thead><tr><th>Entrant</th><th>Agence</th><th>Fonction</th><th>Tuteur</th><th>Accompagnement</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="planning-empty">Aucun résultat pour ces filtres.</div>'}
function ouvrirAgences(){ouvrir('agencesModal','<h2>🏢 Agences</h2>'+AGENCES.map(x=>'<div class="row">🏢 '+x+'</div>').join('')+'<div class="actions"><button class="btn secondary" id="closeAgences">Fermer</button></div>');document.getElementById('closeAgences').onclick=()=>fermer('agencesModal')}
document.getElementById('btnProfil').onclick=choisirProfil;document.getElementById('btnEntrants').onclick=afficherEntrants;document.getElementById('btnTuteurs').onclick=ouvrirTuteurs;document.getElementById('btnAgences').onclick=ouvrirAgences;document.getElementById('btnPlanning').onclick=ouvrirPlanning;actualiser();
</script></body></html>
