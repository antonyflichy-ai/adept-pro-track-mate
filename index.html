<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adept Pro Track Mate</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:700;color:#2563eb}.container{max-width:1200px;margin:24px auto;padding:0 16px}.muted{color:#6b7280}.cards,.menu{display:grid;gap:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:24px 0}.menu{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card,.menu button{background:#fff;border:0;border-radius:12px;box-shadow:0 2px 8px #0000000d}.card{padding:20px}.card h3{margin:0 0 10px;font-size:15px}.number{font-size:32px;font-weight:700;color:#2563eb}.menu button{padding:22px;text-align:left;font-size:16px;cursor:pointer}.menu span{display:block;font-size:30px;margin-bottom:10px}.profile{display:flex;align-items:center;gap:8px}.modal-bg{position:fixed;inset:0;background:#0f172a59;z-index:10}.modal{position:fixed;z-index:11;top:3%;left:50%;transform:translateX(-50%);width:900px;max-width:96%;max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}.field,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#6b7280;color:#fff}.light{background:#f3f4f6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.row{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1 const SUPABASE_URL='https://otbwhaguvekgxhawdson.supabase.co';const SUPABASE_KEY='sb_publishable_y5sJVBrn3CEptGvmK29wEA_SW9pAm0S';const {createClient}=supabase;const sb=createClient(SUPABASE_URL,SUPABASE_KEY);const AGENCES=['Dol de Bretagne','Mont de Marsan','Tarascon','Fleury Mérogis','Noisy le Gd','St Pierre de Chandieu','Vitry-en-Artois'];const FONCTIONS=['Conducteur','Aide-livreur','Technicien de quai','Autre'];const couleurs={'Dol de Bretagne':'#dbeafe','Mont de Marsan':'#dcfce7','Tarascon':'#fef3c7','Fleury Mérogis':'#fce7f3','Noisy le Gd':'#ede9fe','St Pierre de Chandieu':'#ffedd5','Vitry-en-Artois':'#cffafe'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function lire(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function sauver(k,v){localStorage.setItem(k,JSON.stringify(v))}function fermer(id){document.getElementById(id)?.remove();document.getElementById(id+'Bg')?.remove()}function ouvrir(id,html){fermer(id);const bg=document.createElement('div');bg.id=id+'Bg';bg.className='modal-bg';bg.onclick=()=>fermer(id);document.body.appendChild(bg);const m=document.createElement('div');m.id=id;m.className='modal';m.innerHTML=html;document.body.appendChild(m);return m}
async function auth(){try{const operation=(async()=>{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)return data.session.user;const {data:anon,error:anonError}=await sb.auth.signInAnonymously();if(anonError)throw anonError;if(anon?.user)return anon.user;throw new Error('Session anonyme non reçue.')})();const user=await Promise.race([operation,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Délai de connexion dépassé.')),7000))]);await afficherApplication(user);sb.auth.onAuthStateChange(async(e,s)=>{if(s)await afficherApplication(s.user);else if(e==='SIGNED_OUT')afficherConnexion()})}catch(e){console.error('Supabase auth error:',e);await afficherApplication({email:'Mode présentation local'})}}function afficherConnexion(msg=''){document.getElementById('app').innerHTML='<div class="auth"><div class="authbox"><h1>Adept Pro Track Mate</h1><p class="muted">Mode présentation</p><p>Connexion par mot de passe temporairement désactivée pour la présentation.</p><div id="authmsg">'+(msg?'<div class="error">'+esc(msg)+'</div>':'<div class="successmsg">Tentative d’accès automatique…</div>')+'</div></div></div>'}async function motDePasseOublie(){const email=document.getElementById('email').value.trim();if(!email)return document.getElementById('authmsg').innerHTML='<div class="error">Saisissez votre e-mail.</div>';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SUPABASE_URL.replace('.supabase.co','.supabase.co')});document.getElementById('authmsg').innerHTML=error?'<div class="error">'+esc(error.message)+'</div>':'<div class="successmsg">Un e-mail de récupération a été demandé. Vérifiez votre boîte mail.</div>'}
async function afficherApplication(user){document.getElementById('app').innerHTML='<header><div class="logo">Adept Pro Track Mate</div><div class="profile"><span id="userLabel">'+esc(user.email)+'</span><button class="btn light" id="logout">Déconnexion</button></div></header><main class="container"><h1>Tableau de bord</h1><p class="muted">Gestion des plannings, tuteurs, nouveaux entrants et agences</p><section class="cards"><div class="card"><h3>Nouveaux entrants</h3><div class="number" id="compteurEntrants">'+lire('nouveauxEntrants').length+'</div></div><div class="card"><h3>Tuteurs</h3><div class="number">'+lire('tuteurs').length+'</div></div><div class="card"><h3>Agences</h3><div class="number">7</div></div><div class="card"><h3>Plannings</h3><div class="number">'+lire('affectationsTuteurs').length+'</div></div></section><section class="menu"><button id="btnEntrants"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button><button id="btnTuteurs"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button><button id="btnAgences"><span>🏢</span><strong>Agences</strong><br>Voir les agences partenaires</button><button id="btnPlanning"><span>📅</span><strong>Planning</strong><br>Organiser les accompagnements</button></section></main><footer style="text-align:center;color:#9ca3af;padding:35px">Adept Pro Track Mate</footer>';document.getElementById('logout').onclick=()=>sb.auth.signOut();document.getElementById('btnEntrants').onclick=afficherEntrants;document.getElementById('btnTuteurs').onclick=ouvrirTuteurs;document.getElementById('btnAgences').onclick=ouvrirAgences;document.getElementById('btnPlanning').onclick=ouvrirPlanning}
function afficherEntrants(){const e=lire('nouveauxEntrants');let h='<h2>👤 Nouveaux entrants</h2>';if(!e.length)h+='<div class="row">Aucun entrant enregistré.</div>';e.forEach((x,i)=>h+='<div class="row"><strong>'+esc(x.nom)+'</strong><p>📅 '+esc(x.date)+'<br>💼 '+esc(x.fonction)+'<br>🏢 '+esc(x.agence)+'</p><button class="btn danger" data-del="'+i+'">🗑️ Supprimer</button></div>');h+='<div class="actions"><button class="btn primary" id="add">➕ Ajouter</button><button class="btn secondary" id="close">Fermer</button></div>';ouvrir('entrants',h);document.getElementById('add').onclick=()=>{fermer('entrants');ajouterEntrant()};document.getElementById('close').onclick=()=>fermer('entrants');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=lire('nouveauxEntrants');a.splice(+b.dataset.del,1);sauver('nouveauxEntrants',a);afficherEntrants()})}
function ajouterEntrant(){const m=ouvrir('add','<h2>👤 Ajouter un nouvel entrant</h2><label>Nom et prénom</label><input id="n" class="field"><br><br><label>Date d’entrée</label><input id="d" class="field" type="date"><br><br><label>Fonction</label><select id="f" class="field">'+FONCTIONS.map(x=>'<option>'+x+'</option>').join('')+'</select><br><br><label>Agence</label><select id="a" class="field">'+AGENCES.map(x=>'<option>'+x+'</option>').join('')+'</select><div class="actions"><button class="btn primary" id="save">Ajouter</button><button class="btn secondary" id="cancel">Annuler</button></div>');document.getElementById('save').onclick=()=>{const n=document.getElementById('n').value.trim(),d=document.getElementById('d').value,f=document.getElementById('f').value,a=document.getElementById('a').value;if(!n||!d)return alert('Renseignez le nom et la date.');const e=lire('nouveauxEntrants');e.push({id:String(Date.now()),nom:n,date:d,fonction:f,agence:a});sauver('nouveauxEntrants',e);fermer('add');afficherEntrants()};document.getElementById('cancel').onclick=()=>fermer('add')}
function ouvrirTuteurs(){let h='<h2>🎓 Gestion des tuteurs</h2><input id="tn" class="field" placeholder="Nom et prénom"><div class="actions"><button class="btn primary" id="ta">Ajouter</button></div><hr>';const t=lire('tuteurs');t.forEach((x,i)=>h+='<div class="row">👤 '+esc(x.nom)+' <button class="btn danger" data-t="'+i+'">🗑️</button></div>');h+='<button class="btn secondary" id="tc">Fermer</button>';ouvrir('tuteurs',h);document.getElementById('ta').onclick=()=>{const n=document.getElementById('tn').value.trim();if(!n)return;const t=lire('tuteurs');t.push({id:String(Date.now()),nom:n});sauver('tuteurs',t);ouvrirTuteurs()};document.getElementById('tc').onclick=()=>fermer('tuteurs');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=lire('tuteurs');t.splice(+b.dataset.t,1);sauver('tuteurs',t);ouvrirTuteurs()})}
function ouvrirAgences(){ouvrir('agences','<h2>🏢 Agences</h2>'+AGENCES.map(x=>'<div class="row">🏢 '+x+'</div>').join('')+'<button class="btn secondary" id="c">Fermer</button>');document.getElementById('c').onclick=()=>fermer('agences')}
function ouvrirPlanning(){let mois=new Date();mois=new Date(mois.getFullYear(),mois.getMonth(),1);function afficher(){const e=lire('nouveauxEntrants'),t=lire('tuteurs'),a=lire('affectationsTuteurs'),an=mois.getFullYear(),m=mois.getMonth(),decalage=(new Date(an,m,1).getDay()+6)%7,nb=new Date(an,m+1,0).getDate(),titre=mois.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});let h='<h2>📅 Agenda mensuel des formations</h2><div class="actions" style="justify-content:space-between"><button class="btn secondary" id="prev">← Mois précédent</button><strong style="text-transform:capitalize">'+esc(titre)+'</strong><button class="btn secondary" id="next">Mois suivant →</button></div><p class="muted">Chaque formation apparaît sur les jours compris entre sa date de début et sa date de fin, avec son agence.</p><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">';['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(x=>h+='<div style="text-align:center;font-weight:bold;padding:6px">'+x+'</div>');for(let i=0;i<decalage;i++)h+='<div></div>';for(let j=1;j<=nb;j++){const d=an+'-'+String(m+1).padStart(2,'0')+'-'+String(j).padStart(2,'0'),ev=a.filter(q=>q.dateDebut&&q.dateFin&&q.dateDebut<=d&&q.dateFin>=d).map(q=>({q,x:e.find(z=>z.id===q.entrantId)})).filter(v=>v.x);h+='<div style="min-height:95px;border:1px solid #ddd;border-radius:6px;padding:4px;overflow-wrap:anywhere"><strong>'+j+'</strong>'+ev.map(v=>'<div style="font-size:11px;padding:4px;margin-top:4px;border-radius:4px;background:'+(couleurs[v.x.agence]||'#eee')+'"><b>'+esc(v.x.agence)+'</b><br>'+esc(v.x.nom)+'<br>'+esc(v.q.tuteurNom)+'</div>').join('')+'</div>'}h+='</div><hr><h2>🎓 Planning par tuteur</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px">';if(!t.length)h+='<p>Aucun tuteur enregistré.</p>';t.forEach(tu=>{const liste=a.filter(q=>q.tuteurId===tu.id||(!q.tuteurId&&q.tuteurNom===tu.nom)).map(q=>({...q,x:e.find(z=>z.id===q.entrantId)})).filter(q=>q.x);h+='<section class="row"><h3>👤 '+esc(tu.nom)+'</h3>';if(!liste.length)h+='<p class="muted">Aucun accompagnement programmé.</p>';liste.forEach(q=>h+='<div style="background:#f3f4f6;padding:8px;margin:6px 0;border-radius:6px"><b>'+esc(q.x.nom)+'</b><br>'+esc(q.x.agence)+'<br>'+esc(q.dateDebut)+' → '+esc(q.dateFin)+'</div>');h+='</section>'});h+='</div><hr><h2>➕ Programmer un accompagnement</h2>';if(e.length&&t.length)h+='<div class="row"><label>Nouvel entrant</label><select id="pe" class="field">'+e.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nom)+' — '+esc(x.agence)+'</option>').join('')+'</select><br><br><label>Tuteur</label><select id="pt" class="field">'+t.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nom)+'</option>').join('')+'</select><br><br><label>Date de début</label><input id="pd" type="date" class="field"><br><br><label>Date de fin</label><input id="pf" type="date" class="field"><div class="actions"><button class="btn primary" id="ps">Enregistrer l’affectation</button></div></div>';else h+='<p>Ajoutez au moins un entrant et un tuteur avant de programmer une formation.</p>';h+='<button class="btn secondary" id="closePlan">Fermer</button>';ouvrir('planning',h);document.getElementById('closePlan').onclick=()=>fermer('planning');document.getElementById('prev').onclick=()=>{mois=new Date(an,m-1,1);afficher()};document.getElementById('next').onclick=()=>{mois=new Date(an,m+1,1);afficher()};const s=document.getElementById('ps');if(s)s.onclick=()=>{const entrant=e.find(x=>x.id===document.getElementById('pe').value),tuteur=t.find(x=>x.id===document.getElementById('pt').value),d=document.getElementById('pd').value,f=document.getElementById('pf').value;if(!d||!f)return alert('Renseignez les deux dates.');if(f<d)return alert('La date de fin doit être égale ou postérieure à la date de début.');const arr=lire('affectationsTuteurs'),q={entrantId:entrant.id,tuteurId:tuteur.id,tuteurNom:tuteur.nom,dateDebut:d,dateFin:f},i=arr.findIndex(v=>v.entrantId===entrant.id);if(i<0)arr.push(q);else arr[i]=q;sauver('affectationsTuteurs',arr);afficher()}}afficher()}
