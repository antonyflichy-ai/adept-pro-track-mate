<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adept Pro Track Mate</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:22px;font-weight:bold;color:#2563eb}.container{max-width:1200px;margin:30px auto;padding:0 20px}h1{margin-bottom:8px}.subtitle{color:#6b7280;margin-bottom:30px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px}.card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card h3{margin-bottom:12px;font-size:16px}.number{font-size:32px;font-weight:bold;color:#2563eb}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.menu button{border:none;background:#fff;padding:25px;border-radius:12px;text-align:left;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s}.menu button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.1)}.menu span{display:block;font-size:30px;margin-bottom:12px}footer{text-align:center;color:#9ca3af;padding:40px 20px}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:99998}.modal{position:fixed;top:5%;left:50%;transform:translateX(-50%);background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:900px;max-width:94%;max-height:90vh;overflow:auto;z-index:99999}.modal h2{margin-bottom:8px}.muted{color:#6b7280}.btn{padding:10px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:600}.btn-primary{background:#2563eb;color:#fff}.btn-success{background:#059669;color:#fff}.btn-danger{background:#dc2626;color:#fff}.btn-secondary{background:#6b7280;color:#fff}.btn-light{background:#f3f4f6;color:#1f2937}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.field{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;margin-top:7px;background:#fff}.planning-table{width:100%;border-collapse:collapse;margin-top:20px;min-width:700px}.planning-wrap{overflow:auto}.planning-table th,.planning-table td{padding:14px 12px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.planning-table th{font-size:14px;color:#374151;background:#f9fafb}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:13px;font-weight:700}.badge-ok{background:#dcfce7;color:#166534}.badge-wait{background:#fee2e2;color:#991b1b}.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:18px}.empty{padding:25px;background:#f9fafb;border-radius:10px;margin-top:18px;text-align:center;color:#6b7280}@media(max-width:600px){header{padding:15px 18px}.logo{font-size:18px}.container{margin:20px auto}.modal{padding:20px}.planning-table{min-width:650px}}
</style>
</head>
<body>
<header><div class="logo">Adept Pro Track Mate</div><div>Gestion des plannings</div></header>
<main class="container">
<h1>Tableau de bord</h1>
<p class="subtitle">Gestion des plannings, tuteurs, nouveaux entrants et agences</p>
<section class="cards">
<div class="card"><h3>Nouveaux entrants</h3><div class="number" id="compteurEntrants">0</div></div>
<div class="card"><h3>Tuteurs</h3><div class="number" id="compteurTuteurs">0</div></div>
<div class="card"><h3>Agences</h3><div class="number" id="compteurAgences">7</div></div>
<div class="card"><h3>Plannings</h3><div class="number" id="compteurPlannings">0</div></div>
</section>
<section class="menu">
<button onclick="afficherNouveauxEntrants()"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button>
<button onclick="ouvrirTuteurs()"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button>
<button onclick="ouvrirAgences()"><span>🏢</span><strong>Agences</strong><br>Gérer les agences partenaires</button>
<button onclick="ouvrirPlanning()"><span>📅</span><strong>Planning</strong><br>Organiser et suivre les plannings</button>
</section>
</main>
<footer>Adept Pro Track Mate</footer>
<script>
const AGENCES=["Dol de Bretagne","Mont de Marsan","Tarascon","Fleury Mérogis","Noisy le Gd","St Pierre de Chandieu","Vitry-en-Artois"];
const FONCTIONS=["Conducteur","Aide-livreur","Technicien de quai","Autre"];
const COULEURS={"Dol de Bretagne":"#dbeafe","Mont de Marsan":"#dcfce7","Tarascon":"#fef3c7","Fleury Mérogis":"#fce7f3","Noisy le Gd":"#ede9fe","St Pierre de Chandieu":"#ffedd5","Vitry-en-Artois":"#cffafe"};
function lire(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function sauver(k,v){localStorage.setItem(k,JSON.stringify(v))}
function profilActuel(){return(localStorage.getItem("profilActuel")||localStorage.getItem("profil")||localStorage.getItem("role")||"").toLowerCase().trim()}
function estMaster(){return["master","master du site","master_site"].includes(profilActuel())}
function fermer(id){const e=document.getElementById(id);if(e)e.remove();const o=document.getElementById(id+"Overlay");if(o)o.remove()}
function creerModal(id,html,width){fermer(id);const o=document.createElement("div");o.id=id+"Overlay";o.className="overlay";o.onclick=()=>fermer(id);document.body.appendChild(o);const f=document.createElement("div");f.id=id;f.className="modal";if(width)f.style.width=width;f.innerHTML=html;document.body.appendChild(f);return f}
function mettreAJourCompteurs(){document.getElementById("compteurEntrants").textContent=lire("nouveauxEntrants").length;document.getElementById("compteurTuteurs").textContent=lire("tuteurs").length;document.getElementById("compteurPlannings").textContent=lire("affectationsTuteurs").length}
function afficherNouveauxEntrants(){afficherListeNouveauxEntrants()}
function ouvrirNouveauxEntrants(){
 const f=creerModal("formNouvelEntrant",`<h2>👤 Ajouter un nouvel entrant</h2><p class="muted">Renseignez les informations du nouvel entrant.</p><br><label><strong>Nom et prénom</strong></label><input id="nomEntrantForm" class="field" type="text" placeholder="Nom et prénom"><br><br><label><strong>Date d'entrée</strong></label><input id="dateEntrantForm" class="field" type="date"><br><br><label><strong>Fonction</strong></label><div id="choixFonction" class="actions"></div><br><label><strong>Agence</strong></label><div id="choixAgence" style="margin-top:10px"></div><div class="actions"><button id="annulerEntrant" class="btn btn-secondary">Annuler</button><button id="validerEntrant" class="btn btn-primary">Ajouter</button></div>`);
 FONCTIONS.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="btn btn-light";b.textContent=x;b.onclick=()=>{f.querySelectorAll(".fonctionChoisie").forEach(q=>q.classList.remove("fonctionChoisie"));f.querySelectorAll("#choixFonction button").forEach(q=>q.style.background="#f3f4f6");b.classList.add("fonctionChoisie");b.style.background="#bfdbfe"};f.querySelector("#choixFonction").appendChild(b)});
 AGENCES.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="btn btn-light";b.textContent=x;b.style.display="block";b.style.width="100%";b.style.margin="6px 0";b.style.textAlign="left";b.onclick=()=>{f.querySelectorAll(".agenceChoisie").forEach(q=>{q.classList.remove("agenceChoisie");q.style.background="#f3f4f6"});b.classList.add("agenceChoisie");b.style.background=COULEURS[x]||"#e5e7eb"};f.querySelector("#choixAgence").appendChild(b)});
 f.querySelector("#annulerEntrant").onclick=()=>fermer("formNouvelEntrant");
 f.querySelector("#validerEntrant").onclick=()=>{const nom=f.querySelector("#nomEntrantForm").value.trim(),date=f.querySelector("#dateEntrantForm").value,fb=f.querySelector(".fonctionChoisie"),ab=f.querySelector(".agenceChoisie");if(!nom)return alert("Merci de renseigner le nom et prénom.");if(!date)return alert("Merci de sélectionner la date d'entrée.");if(!fb)return alert("Merci de sélectionner une fonction.");if(!ab)return alert("Merci de sélectionner une agence.");const e=lire("nouveauxEntrants");e.push({id:Date.now().toString(),nom,date,fonction:fb.textContent.trim(),agence:ab.textContent.trim()});sauver("nouveauxEntrants",e);fermer("formNouvelEntrant");mettreAJourCompteurs();afficherListeNouveauxEntrants()};
}
function afficherListeNouveauxEntrants(){
 const entrants=lire("nouveauxEntrants"),aff=lire("affectationsTuteurs");
 if(!entrants.length){ouvrirNouveauxEntrants();return}
 let c=`<h2>👤 Nouveaux entrants</h2><p class="muted">Liste des entrants enregistrés.</p>`;
 entrants.forEach((x,i)=>{const a=aff.find(q=>q.entrantId===x.id);c+=`<div style="border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0"><strong>${i+1}. ${x.nom}</strong><p style="margin:8px 0">📅 ${x.date}<br>💼 ${x.fonction}<br>🏢 ${x.agence}<br>🎓 Tuteur : <strong>${a?a.tuteurNom:"Non affecté"}</strong>${a?`<br>📆 Accompagnement : ${a.dateDebut} → ${a.dateFin}`:""}</p><button class="btn btn-danger" onclick="supprimerNouvelEntrant(${i})">🗑️ Supprimer</button></div>`});
 c+=`<div class="actions"><button class="btn btn-secondary" onclick="fermer('listeNouveauxEntrants')">Fermer</button><button class="btn btn-primary" onclick="fermer('listeNouveauxEntrants');ouvrirNouveauxEntrants()">➕ Ajouter</button>${estMaster()?`<button class="btn btn-success" onclick="fermer('listeNouveauxEntrants');ouvrirAffectationsTuteurs()">🎓 Affecter un tuteur</button>`:""}</div>`;
 creerModal("listeNouveauxEntrants",c,"700px");
}
function supprimerNouvelEntrant(i){const e=lire("nouveauxEntrants");if(!confirm("Voulez-vous vraiment supprimer cet entrant ?"))return;const id=e[i]&&e[i].id;e.splice(i,1);sauver("nouveauxEntrants",e);if(id)sauver("affectationsTuteurs",lire("affectationsTuteurs").filter(q=>q.entrantId!==id));mettreAJourCompteurs();afficherListeNouveauxEntrants()}
function ouvrirTuteurs(){
 const t=lire("tuteurs");let c=`<h2>🎓 Gestion des tuteurs</h2><p class="muted">Ajoutez les tuteurs disponibles pour les accompagnements.</p><br><label><strong>Nom et prénom du tuteur</strong></label><input id="nomNouveauTuteur" class="field" type="text" placeholder="Nom et prénom"><div class="actions"><button class="btn btn-primary" onclick="ajouterTuteur()">➕ Ajouter le tuteur</button></div><hr style="margin:22px 0"><h3>Tuteurs enregistrés</h3>`;
 if(!t.length)c+=`<div class="empty">Aucun tuteur enregistré.</div>`;else t.forEach((x,i)=>c+=`<div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center"><strong>👤 ${x.nom}</strong><button class="btn btn-danger" onclick="supprimerTuteur(${i})">🗑️</button></div>`);
 c+=`<div class="actions">${estMaster()?`<button class="btn btn-success" onclick="fermer('fenetreTuteurs');ouvrirAffectationsTuteurs()">🎓 Affecter un tuteur à un entrant</button>`:""}<button class="btn btn-secondary" onclick="fermer('fenetreTuteurs')">Fermer</button></div>`;
 creerModal("fenetreTuteurs",c,"550px");
}
function ajouterTuteur(){const ch=document.getElementById("nomNouveauTuteur");if(!ch)return;const nom=ch.value.trim();if(!nom)return alert("Merci de renseigner le nom et prénom du tuteur.");const t=lire("tuteurs");if(t.some(x=>x.nom.toLowerCase()===nom.toLowerCase()))return alert("Ce tuteur est déjà enregistré.");t.push({id:Date.now().toString(),nom});sauver("tuteurs",t);mettreAJourCompteurs();ouvrirTuteurs()}
function supprimerTuteur(i){const t=lire("tuteurs");if(!confirm("Voulez-vous supprimer ce tuteur ?"))return;t.splice(i,1);sauver("tuteurs",t);mettreAJourCompteurs();ouvrirTuteurs()}
function ouvrirAffectationsTuteurs(){if(!estMaster())return alert("Accès réservé au Master du site.");const e=lire("nouveauxEntrants"),t=lire("tuteurs"),a=lire("affectationsTuteurs");let c=`<h2>🎓 Affectation des tuteurs</h2><p class="muted">Cette fonction est disponible en mode Master.</p>`;if(!e.length)c+=`<div class="empty">Aucun nouvel entrant enregistré.</div>`;else if(!t.length)c+=`<div class="empty">Aucun tuteur enregistré. Ajoutez d'abord les tuteurs.</div>`;else e.forEach(x=>{const old=a.find(q=>q.entrantId===x.id);c+=`<div style="border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0"><strong>👤 ${x.nom}</strong><p style="margin:6px 0 12px">📅 ${x.date} · 🏢 ${x.agence} · 💼 ${x.fonction}</p><label><strong>Tuteur</strong></label><select id="tuteur_${x.id}" class="field"><option value="">-- Aucun tuteur --</option>${t.map(q=>`<option value="${q.id}" ${old&&old.tuteurId===q.id?"selected":""}>${q.nom}</option>`).join("")}</select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div><label><strong>Début</strong></label><input id="debut_${x.id}" class="field" type="date" value="${old?old.dateDebut:x.date}"></div><div><label><strong>Fin</strong></label><input id="fin_${x.id}" class="field" type="date" value="${old?old.dateFin:x.date}"></div></div><div class="actions"><button class="btn btn-success" onclick="enregistrerAffectation('${x.id}')">💾 Enregistrer</button>${old?`<button class="btn btn-danger" onclick="supprimerAffectation('${x.id}')">Retirer</button>`:""}</div></div>`});c+=`<div class="actions"><button class="btn btn-secondary" onclick="fermer('formAffectationTuteur')">Fermer</button></div>`;creerModal("formAffectationTuteur",c,"700px")}
function enregistrerAffectation(id){if(!estMaster())return alert("Accès réservé au Master du site.");const e=lire("nouveauxEntrants").find(x=>x.id===id),t=lire("tuteurs").find(x=>x.id===document.getElementById("tuteur_"+id).value),debut=document.getElementById("debut_"+id).value,fin=document.getElementById("fin_"+id).value;if(!e)return;if(!t)return supprimerAffectation(id);if(!debut||!fin)return alert("Merci de renseigner les dates.");if(fin<debut)return alert("La date de fin doit être postérieure ou égale à la date de début.");let a=lire("affectationsTuteurs").filter(x=>x.entrantId!==id);a.push({entrantId:id,tuteurId:t.id,tuteurNom:t.nom,dateDebut:debut,dateFin:fin,agence:e.agence});sauver("affectationsTuteurs",a);mettreAJourCompteurs();ouvrirAffectationsTuteurs()}
function supprimerAffectation(id){if(!estMaster())return alert("Accès réservé au Master du site.");sauver("affectationsTuteurs",lire("affectationsTuteurs").filter(x=>x.entrantId!==id));mettreAJourCompteurs();ouvrirAffectationsTuteurs()}
function ouvrirAgences(){let c=`<h2>🏢 Agences partenaires</h2><p class="muted">Sélectionnez une agence pour consulter son nom.</p><div style="margin-top:15px">${AGENCES.map(x=>`<button class="btn btn-light" style="display:block;width:100%;margin:6px 0;text-align:left;background:${COULEURS[x]||"#f3f4f6"}" onclick="selectionnerAgence('${x.replace(/'/g,"\\'")}')">${x}</button>`).join("")}</div><p id="agenceSelectionnee" style="margin-top:15px;font-weight:bold"></p><div class="actions"><button class="btn btn-secondary" onclick="fermer('fenetreAgences')">Fermer</button></div>`;creerModal("fenetreAgences",c,"450px")}
function selectionnerAgence(nom){const e=document.getElementById("agenceSelectionnee");if(e)e.textContent="Agence sélectionnée : "+nom}
function ouvrirPlanning(){
 const entrants=lire("nouveauxEntrants"),aff=lire("affectationsTuteurs");
 let c=`<h2>📅 Planning</h2><p class="muted">Vue des accompagnements programmés</p><div class="filter-grid"><select id="filtreAgence" class="field"><option value="">Toutes les agences</option>${AGENCES.map(x=>`<option>${x}</option>`).join("")}</select><select id="filtreTuteur" class="field"><option value="">Tous les tuteurs</option>${lire("tuteurs").map(x=>`<option value="${x.id}">${x.nom}</option>`).join("")}</select></div><div id="planningTable"></div><div class="actions"><button class="btn btn-secondary" onclick="fermer('fenetrePlanning')">Fermer</button>${estMaster()?`<button class="btn btn-success" onclick="fermer('fenetrePlanning');ouvrirAffectationsTuteurs()">🎓 Gérer les affectations</button>`:""}</div>`;
 const f=creerModal("fenetrePlanning",c,"1000px");
 const rendre=()=>{const agence=document.getElementById("filtreAgence").value,tuteur=document.getElementById("filtreTuteur").value;const lignes=entrants.filter(e=>(!agence||e.agence===agence)&&(!tuteur||((aff.find(a=>a.entrantId===e.id)||{}).tuteurId===tuteur)));let h=`<div class="planning-wrap"><table class="planning-table"><thead><tr><th>Entrant</th><th>Agence</th><th>Fonction</th><th>Tuteur</th><th>Accompagnement</th></tr></thead><tbody>`;if(!lignes.length)h+=`<tr><td colspan="5"><div class="empty">Aucun accompagnement à afficher.</div></td></tr>`;else lignes.forEach(e=>{const a=aff.find(x=>x.entrantId===e.id);h+=`<tr><td><strong>${e.nom}</strong><br><small>${e.date}</small></td><td>${e.agence}</td><td>${e.fonction}</td><td>${a?`<span class="badge badge-ok">${a.tuteurNom}</span>`:`<span class="badge badge-wait">Non affecté</span>`}</td><td>${a?`${a.dateDebut} → ${a.dateFin}`:`<span class="muted">À programmer</span>`}</td></tr>`});h+=`</tbody></table></div>`;document.getElementById("planningTable").innerHTML=h};document.getElementById("filtreAgence").onchange=rendre;document.getElementById("filtreTuteur").onchange=rendre;rendre();
}
document.addEventListener("DOMContentLoaded",mettreAJourCompteurs);
</script>
</body>
</html>
