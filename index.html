<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adept Pro Track Mate</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
    header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:22px;font-weight:bold;color:#2563eb}
    .container{max-width:1200px;margin:30px auto;padding:0 20px}
    h1{margin-bottom:8px}.subtitle{color:#6b7280;margin-bottom:30px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px}
    .card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .card h3{margin-bottom:12px;font-size:16px}.number{font-size:32px;font-weight:bold;color:#2563eb}
    .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
    .menu button{border:none;background:#fff;padding:25px;border-radius:12px;text-align:left;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s}
    .menu button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.1)}
    .menu span{display:block;font-size:30px;margin-bottom:12px}footer{text-align:center;color:#9ca3af;padding:40px 20px}
  </style>
</head>
<body>
<header><div class="logo">Adept Pro Track Mate</div><div>Gestion des plannings</div></header>
<main class="container">
<h1>Tableau de bord</h1>
<p class="subtitle">Gestion des plannings, tuteurs, nouveaux entrants et agences</p>
<section class="cards">
<div class="card"><h3>Nouveaux entrants</h3><div class="number" id="compteurEntrants">0</div></div>
<div class="card"><h3>Tuteurs</h3><div class="number" id="compteurTuteurs">0</div></div>
<div class="card"><h3>Agences</h3><div class="number" id="compteurAgences">7</div></div>
<div class="card"><h3>Plannings</h3><div class="number" id="compteurPlannings">0</div></div>
</section>
<section class="menu">
<button onclick="afficherNouveauxEntrants()"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button>
<button onclick="ouvrirTuteurs()"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button>
<button onclick="ouvrirAgences()"><span>🏢</span><strong>Agences</strong><br>Gérer les agences partenaires</button>
<button onclick="ouvrirPlanning()"><span>📅</span><strong>Planning</strong><br>Organiser et suivre les plannings</button>
</section>
</main>
<footer>Adept Pro Track Mate</footer>
<script>
const AGENCES=["Dol de Bretagne","Mont de Marsan","Tarascon","Fleury Mérogis","Noisy le Gd","St Pierre de Chandieu","Vitry-en-Artois"];
const FONCTIONS=["Conducteur","Aide-livreur","Technicien de quai","Autre"];
const COULEURS={"Dol de Bretagne":"#dbeafe","Mont de Marsan":"#dcfce7","Tarascon":"#fef3c7","Fleury Mérogis":"#fce7f3","Noisy le Gd":"#ede9fe","St Pierre de Chandieu":"#ffedd5","Vitry-en-Artois":"#cffafe"};
function lire(key){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}
function profilActuel(){return (localStorage.getItem("profilActuel")||localStorage.getItem("profil")||localStorage.getItem("role")||"").toLowerCase().trim()}
function estMaster(){return ["master","master du site","master_site"].includes(profilActuel())}
function mettreAJourCompteurs(){document.getElementById("compteurEntrants").textContent=lire("nouveauxEntrants").length;document.getElementById("compteurTuteurs").textContent=lire("tuteurs").length;document.getElementById("compteurPlannings").textContent=lire("affectationsTuteurs").length}
function afficherNouveauxEntrants(){afficherListeNouveauxEntrants()}
function ouvrirNouveauxEntrants(){
 const ancien=document.getElementById("formNouvelEntrant");if(ancien)ancien.remove();
 const f=document.createElement("div");f.id="formNouvelEntrant";
 Object.assign(f.style,{position:"fixed",top:"5%",left:"50%",transform:"translateX(-50%)",background:"white",padding:"30px",borderRadius:"15px",boxShadow:"0 10px 40px rgba(0,0,0,.3)",width:"450px",maxWidth:"90%",maxHeight:"90vh",overflowY:"auto",zIndex:"99999"});
 f.innerHTML=`<h2>👤 Ajouter un nouvel entrant</h2><label><strong>Nom et prénom</strong></label><input id="nomEntrantForm" type="text" placeholder="Nom et prénom" style="width:100%;padding:10px;margin:8px 0 18px"><label><strong>Date d'entrée</strong></label><input id="dateEntrantForm" type="date" style="width:100%;padding:10px;margin:8px 0 18px"><label><strong>Fonction</strong></label><div id="choixFonction" style="margin:10px 0 18px"></div><label><strong>Agence</strong></label><div id="choixAgence" style="margin:10px 0 20px"></div><div style="text-align:right"><button id="annulerEntrant" style="padding:12px 20px;border:0;border-radius:8px;cursor:pointer">Annuler</button><button id="validerEntrant" style="padding:12px 20px;margin-left:8px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer">Ajouter</button></div>`;
 document.body.appendChild(f);
 FONCTIONS.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;Object.assign(b.style,{padding:"10px 15px",margin:"4px",borderRadius:"8px",border:"1px solid #ccc",background:"white",cursor:"pointer"});b.onclick=()=>{f.querySelectorAll(".fonctionChoisie").forEach(q=>{q.classList.remove("fonctionChoisie");q.style.background="white"});b.classList.add("fonctionChoisie");b.style.background="#bfdbfe"};f.querySelector("#choixFonction").appendChild(b)});
 AGENCES.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;Object.assign(b.style,{display:"block",width:"100%",padding:"11px",margin:"5px 0",borderRadius:"8px",border:"1px solid #ccc",background:"white",cursor:"pointer",textAlign:"left"});b.onclick=()=>{f.querySelectorAll(".agenceChoisie").forEach(q=>{q.classList.remove("agenceChoisie");q.style.background="white"});b.classList.add("agenceChoisie");b.style.background=COULEURS[x]||"#e5e7eb"};f.querySelector("#choixAgence").appendChild(b)});
 f.querySelector("#annulerEntrant").onclick=()=>f.remove();
 f.querySelector("#validerEntrant").onclick=()=>{const nom=f.querySelector("#nomEntrantForm").value.trim(),date=f.querySelector("#dateEntrantForm").value,fb=f.querySelector(".fonctionChoisie"),ab=f.querySelector(".agenceChoisie");if(!nom)return alert("Merci de renseigner le nom et prénom.");if(!date)return alert("Merci de sélectionner la date d'entrée.");if(!fb)return alert("Merci de sélectionner une fonction.");if(!ab)return alert("Merci de sélectionner une agence.");const entrants=lire("nouveauxEntrants");entrants.push({id:Date.now().toString(),nom,date,fonction:fb.textContent.trim(),agence:ab.textContent.trim()});localStorage.setItem("nouveauxEntrants",JSON.stringify(entrants));f.remove();mettreAJourCompteurs();afficherListeNouveauxEntrants()};
}
function afficherListeNouveauxEntrants(){
 const entrants=lire("nouveauxEntrants");const ancien=document.getElementById("listeNouveauxEntrants");if(ancien)ancien.remove();
 if(!entrants.length){ouvrirNouveauxEntrants();return}
 const f=document.createElement("div");f.id="listeNouveauxEntrants";Object.assign(f.style,{position:"fixed",top:"5%",left:"50%",transform:"translateX(-50%)",background:"white",padding:"30px",borderRadius:"15px",boxShadow:"0 10px 40px rgba(0,0,0,.3)",width:"650px",maxWidth:"90%",maxHeight:"90vh",overflowY:"auto",zIndex:"99999"});
 const affectations=lire("affectationsTuteurs");let c="<h2>👤 Nouveaux entrants</h2>";
 entrants.forEach((x,i)=>{const a=affectations.find(q=>q.entrantId===x.id);c+=`<div style="border:1px solid #ddd;border-radius:10px;padding:15px;margin:12px 0"><strong>${i+1}. ${x.nom}</strong><p style="margin:8px 0">📅 Date d'entrée : ${x.date}<br>💼 Fonction : ${x.fonction}<br>🏢 Agence : ${x.agence}<br>🎓 Tuteur : <strong>${a?a.tuteurNom:"Non affecté"}</strong>${a?`<br>📆 Accompagnement : ${a.dateDebut} → ${a.dateFin}`:""}</p><button onclick="supprimerNouvelEntrant(${i})" style="padding:8px 12px;border:0;border-radius:6px;background:#dc2626;color:white;cursor:pointer">🗑️ Supprimer</button></div>`});
 c+=`<br><button onclick="document.getElementById('listeNouveauxEntrants').remove()" style="padding:10px 18px;border:0;border-radius:8px;background:#6b7280;color:white;cursor:pointer">Fermer</button><button onclick="document.getElementById('listeNouveauxEntrants').remove();ouvrirNouveauxEntrants()" style="padding:10px 18px;margin-left:8px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer">➕ Ajouter</button>`;
 if(estMaster())c+=`<button onclick="document.getElementById('listeNouveauxEntrants').remove();ouvrirAffectationsTuteurs()" style="padding:10px 18px;margin-left:8px;border:0;border-radius:8px;background:#059669;color:white;cursor:pointer">🎓 Affecter un tuteur</button>`;
 f.innerHTML=c;document.body.appendChild(f)
}
function supprimerNouvelEntrant(i){const e=lire("nouveauxEntrants");if(!confirm("Voulez-vous vraiment supprimer cet entrant ?"))return;const id=e[i]&&e[i].id;e.splice(i,1);localStorage.setItem("nouveauxEntrants",JSON.stringify(e));if(id){const a=lire("affectationsTuteurs").filter(q=>q.entrantId!==id);localStorage.setItem("affectationsTuteurs",JSON.stringify(a))}mettreAJourCompteurs();afficherListeNouveauxEntrants()}

function ouvrirTuteurs(){
 const ancien=document.getElementById("fenetreTuteurs");if(ancien)ancien.remove();const tuteurs=lire("tuteurs");const f=document.createElement("div");f.id="fenetreTuteurs";Object.assign(f.style,{position:"fixed",top:"5%",left:"50%",transform:"translateX(-50%)",background:"white",padding:"30px",borderRadius:"15px",boxShadow:"0 10px 40px rgba(0,0,0,.3)",width:"500px",maxWidth:"90%",maxHeight:"90vh",overflowY:"auto",zIndex:"99999"});
 let c=`<h2>🎓 Gestion des tuteurs</h2><label><strong>Nom et prénom du tuteur</strong></label><input id="nomNouveauTuteur" type="text" placeholder="Nom et prénom" style="width:100%;padding:10px;margin:10px 0 15px"><button onclick="ajouterTuteur()" style="padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer">➕ Ajouter le tuteur</button><hr style="margin:20px 0"><h3>Tuteurs enregistrés</h3>`;
 if(!tuteurs.length)c+="<p style='margin-top:15px'>Aucun tuteur enregistré.</p>";else tuteurs.forEach((x,i)=>c+=`<div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center"><strong>👤 ${x.nom}</strong><button onclick="supprimerTuteur(${i})" style="padding:7px 10px;border:0;border-radius:6px;background:#dc2626;color:white;cursor:pointer">🗑️</button></div>`);
 if(estMaster())c+=`<hr style="margin:20px 0"><button onclick="fermerFenetreTuteurs();ouvrirAffectationsTuteurs()" style="padding:10px 18px;border:0;border-radius:8px;background:#059669;color:white;cursor:pointer">🎓 Affecter un tuteur à un entrant</button>`;
 else c+=`<p style="margin-top:20px;padding:12px;border-radius:8px;background:#f3f4f6;color:#4b5563">🔒 L'affectation des tuteurs est réservée au Master du site.</p>`;
 c+=`<br><button onclick="fermerFenetreTuteurs()" style="padding:10px 18px;border:0;border-radius:8px;background:#6b7280;color:white;cursor:pointer">Fermer</button>`;f.innerHTML=c;document.body.appendChild(f)
}
function ajouterTuteur(){const champ=document.getElementById("nomNouveauTuteur");if(!champ)return;const nom=champ.value.trim();if(!nom)return alert("Merci de renseigner le nom et prénom du tuteur.");const tuteurs=lire("tuteurs");if(tuteurs.some(t=>t.nom.toLowerCase()===nom.toLowerCase()))return alert("Ce tuteur est déjà enregistré.");tuteurs.push({id:Date.now().toString(),nom});localStorage.setItem("tuteurs",JSON.stringify(tuteurs));mettreAJourCompteurs();ouvrirTuteurs()}
function supprimerTuteur(i){const tuteurs=lire("tuteurs");if(!confirm("Voulez-vous supprimer ce tuteur ?"))return;tuteurs.splice(i,1);localStorage.setItem("tuteurs",JSON.stringify(tuteurs));mettreAJourCompteurs();ouvrirTuteurs()}
function fermerFenetreTuteurs(){const f=document.getElementById("fenetreTuteurs");if(f)f.remove()}

function ouvrirAffectationsTuteurs(){
 if(!estMaster()){alert("Accès réservé au Master du site.");return}
 const anciens=["formAffectationTuteur","fenetreTuteurs"];anciens.forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});
 const entrants=lire("nouveauxEntrants"),tuteurs=lire("tuteurs"),affectations=lire("affectationsTuteurs");
 const f=document.createElement("div");f.id="formAffectationTuteur";Object.assign(f.style,{position:"fixed",top:"5%",left:"50%",transform:"translateX(-50%)",background:"white",padding:"30px",borderRadius:"15px",boxShadow:"0 10px 40px rgba(0,0,0,.3)",width:"650px",maxWidth:"92%",maxHeight:"90vh",overflowY:"auto",zIndex:"100000"});
 let c=`<h2>🎓 Affectation des tuteurs</h2><p style="margin:8px 0 20px;color:#6b7280">Seul le Master du site peut effectuer cette affectation.</p>`;
 if(!entrants.length)c+=`<p>Aucun nouvel entrant enregistré.</p>`;
 else if(!tuteurs.length)c+=`<p>Aucun tuteur enregistré. Ajoutez d'abord les tuteurs.</p>`;
 else entrants.forEach((e,i)=>{const a=affectations.find(q=>q.entrantId===e.id)||{};c+=`<div style="border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0"><strong>👤 ${e.nom}</strong><p style="margin:6px 0 12px">📅 Entrée : ${e.date} · 🏢 ${e.agence} · 💼 ${e.fonction}</p><label><strong>Tuteur</strong></label><select data-entrant="${e.id}" class="selectTuteur" style="width:100%;padding:10px;margin:7px 0 12px"><option value="">-- Aucun tuteur --</option>${tuteurs.map(t=>`<option value="${t.id}" ${a.tuteurId===t.id?"selected":""}>${t.nom}</option>`).join("")}</select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label><strong>Début</strong></label><input data-entrant-date-debut="${e.id}" type="date" value="${a.dateDebut||e.date}" style="width:100%;padding:10px;margin-top:7px"></div><div><label><strong>Fin</strong></label><input data-entrant-date-fin="${e.id}" type="date" value="${a.dateFin||e.date}" style="width:100%;padding:10px;margin-top:7px"></div></div><button onclick="enregistrerAffectation('${e.id}')" style="margin-top:12px;padding:9px 15px;border:0;border-radius:8px;background:#059669;color:white;cursor:pointer">💾 Enregistrer l'affectation</button>${a.tuteurNom?`<button onclick="supprimerAffectation('${e.id}')" style="margin-top:12px;margin-left:8px;padding:9px 15px;border:0;border-radius:8px;background:#dc2626;color:white;cursor:pointer">Retirer</button>`:""}</div>`});
 c+=`<button onclick="document.getElementById('formAffectationTuteur').remove()" style="padding:10px 18px;border:0;border-radius:8px;background:#6b7280;color:white;cursor:pointer">Fermer</button>`;f.innerHTML=c;document.body.appendChild(f)
}
function enregistrerAffectation(entrantId){if(!estMaster()){alert("Accès réservé au Master du site.");return}const e=lire("nouveauxEntrants").find(x=>x.id===entrantId),s=document.querySelector(`.selectTuteur[data-entrant="${entrantId}"]`),t=lire("tuteurs").find(x=>x.id===s.value),debut=document.querySelector(`[data-entrant-date-debut="${entrantId}"]`).value,fin=document.querySelector(`[data-entrant-date-fin="${entrantId}"]`).value;if(!e)return;if(!s.value)return supprimerAffectation(entrantId);if(!debut||!fin)return alert("Merci de renseigner les dates.");if(fin<debut)return alert("La date de fin doit être postérieure ou égale à la date de début.");let a=lire("affectationsTuteurs").filter(x=>x.entrantId!==entrantId);a.push({entrantId,tuteurId:t.id,tuteurNom:t.nom,dateDebut:debut,dateFin:fin,agence:e.agence});localStorage.setItem("affectationsTuteurs",JSON.stringify(a));mettreAJourCompteurs();alert("Affectation enregistrée pour "+e.nom+" avec "+t.nom+".");ouvrirAffectationsTuteurs()}
function supprimerAffectation(entrantId){if(!estMaster()){alert("Accès réservé au Master du site.");return}let a=lire("affectationsTuteurs").filter(x=>x.entrantId!==entrantId);localStorage.setItem("affectationsTuteurs",JSON.stringify(a));mettreAJourCompteurs();ouvrirAffectationsTuteurs()}

function ouvrirAgences(){const ancien=document.getElementById("fenetreAgences");if(ancien)ancien.remove();const f=document.createElement("div");f.id="fenetreAgences";Object.assign(f.style,{position:"fixed",top:"10%",left:"50%",transform:"translateX(-50%)",background:"white",padding:"25px",borderRadius:"15px",boxShadow:"0 10px 40px rgba(0,0,0,.3)",width:"400px",maxWidth:"90%",maxHeight:"80vh",overflowY:"auto",zIndex:"99999"});f.innerHTML="<h3>🏢 Agences</h3>"+AGENCES.map(x=>`<button onclick="selectionnerAgence('${x.replace(/'/g,"\\'")}')" style="display:block;width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;background:white;text-align:left;cursor:pointer">${x}</button>`).join("")+"<p id='agenceSelectionnee' style='margin-top:15px;font-weight:bold'></p><br><button onclick=\"document.getElementById('fenetreAgences').remove()\">Fermer</button>";document.body.appendChild(f)}
function selectionnerAgence(nom){const e=document.getElementById("agenceSelectionnee");if(e)e.textContent="Agence sélectionnée : "+nom}
function ouvrirPlanning(){if(estMaster())ouvrirAffectationsTuteurs();else{const entrants=lire("nouveauxEntrants"),a=lire("affectationsTuteurs");const lignes=entrants.map(e=>{const x=a.find(q=>q.entrantId===e.id);return `${e.nom} — ${e.agence} — ${x?x.tuteurNom+" ("+x.dateDebut+" → "+x.dateFin+")":"Tuteur non affecté"}`}).join("\n");alert("PLANNING\n\n"+(lignes||"Aucun entrant enregistré."))}}
document.addEventListener("DOMContentLoaded",mettreAJourCompteurs);
</script>
</body>
</html>
