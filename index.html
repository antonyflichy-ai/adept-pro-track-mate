<!DOCTYPE html>
<html lang="fr">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adept Pro Track Mate</title>
   <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 16px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      color: #2563eb;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .menu button {
      border: none;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: left;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .menu button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .menu span {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }

    footer {
      text-align: center;
      color: #9ca3af;
      padding: 40px 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Adept Pro Track Mate</div>
    <div>Gestion des plannings</div>
  </header>

  <main class="container">

    <h1>Tableau de bord</h1>

    <p class="subtitle">
      Gestion des plannings, tuteurs, nouveaux entrants et agences
    </p>

    <section class="cards">

      <div class="card">
        <h3>Nouveaux entrants</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Tuteurs</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Agences</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Plannings</h3>
        <div class="number">0</div>
      </div>

    </section>

    <section class="menu">

      <button onclick="ouvrirNouveauxEntrants()">
        <span>👤</span>
        <strong>Nouveaux entrants</strong>
        <br>
        Ajouter et gérer les nouveaux entrants
      </button>

      <button onclick="alert('Module Tuteurs')">
        <span>🎓</span>
        <strong>Tuteurs</strong>
        <br>
        Gérer les tuteurs disponibles
      </button>

      <button onclick="ouvrirAgences()">
    <span>🏢</span>
    <strong>Agences</strong>
    <br>
    Gérer les agences partenaires
</button>
<div id="nouvelEntrant" style="display:none;">

  <h3>Ajouter un nouvel entrant</h3>

  <label>Nom et prénom :</label>
  <input type="text" id="nomEntrant" placeholder="Nom et prénom">

  <br><br>

  <label>Date d'entrée :</label>
  <input type="date" id="dateEntree">

  <br><br>

  <label>Fonction :</label>
  <select id="fonctionEntrant">
    <option value="">-- Choisir une fonction --</option>
    <option>Aide-livreur</option>
    <option>Conducteur</option>
    <option>Conducteur PL</option>
    <option>Manutentionnaire</option>
    <option>technicien de quai</option>
  </select>

  <br><br>

  <label>Agence :</label>
  <select id="agenceEntrant">
    <option value="">-- Choisir une agence --</option>
    <option>Dol de Bretagne</option>
    <option>Mont de Marsan</option>
    <option>Tarascon</option>
    <option>Fleury Merogis</option>
    <option>Noisy le Gd</option>
    <option>St Pierre de Chandieu</option>
    <option>Vitry-en-Artois</option>
  </select>

  <br><br>

  <button onclick="ajouterEntrant()">Ajouter le nouvel entrant</button>

</div>
<div id="choixAgences" style="display:none;">
    <h3>Sélectionner une agence</h3>

   <button onclick="selectionnerAgence('Dol de Bretagne')">
    Dol de Bretagne
</button>

<button onclick="selectionnerAgence('Mont de Marsan')">
    Mont de Marsan
</button>

<button onclick="selectionnerAgence('Tarascon')">
    Tarascon
</button>

<button onclick="selectionnerAgence('Fleury Mérogis')">
    Fleury Mérogis
</button>

<button onclick="selectionnerAgence('Noisy le Gd')">
    Noisy le Gd
</button>

<button onclick="selectionnerAgence('St Pierre de Chandieu')">
    St Pierre de Chandieu
</button>

<button onclick="selectionnerAgence('Vitry-en-Artois')">
    Vitry-en-Artois
</button>

    <p id="agenceSelectionnee"></p>
</div>

      <button onclick="ouvrirPlanning()">
        <span>📅</span>
        <strong>Planning</strong>
        <br>
        Organiser et suivre les plannings
      </button>

    </section>

  </main>

  <footer>
    Adept Pro Track Mate
  </footer>
<script>
function ouvrirNouveauxEntrants() {
    let nom = prompt("Nom et prénom du nouvel entrant :");
    if (!nom) return;

    let dateEntree = prompt("Date d'entrée (JJ/MM/AAAA) :");
    if (!dateEntree) return;

    let fonction = prompt("Fonction : aide-livreur, conducteur, autre... :");
    if (!fonction) return;

    let agence = prompt("Agence : Dol de Bretagne, Mont de Marsan, Tarascon, etc. :");
    if (!agence) return;

    alert(
        "Nouvel entrant ajouté !\n\n" +
        "Nom : " + nom + "\n" +
        "Date d'entrée : " + dateEntree + "\n" +
        "Fonction : " + fonction + "\n" +
        "Agence : " + agence
    );
}

function ouvrirTuteurs() {
    alert("Module Tuteurs");
}

function ouvrirAgences() {
    document.getElementById("choixAgences").style.display = "block";
}

function selectionnerAgence(nom) {
    document.getElementById("agenceSelectionnee").textContent =
        "Agence sélectionnée : " + nom;
}

function ouvrirPlanning() {
    alert("Module Planning");
}
</script>
</body>
</html>
