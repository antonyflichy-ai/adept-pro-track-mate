<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adept Pro Track Mate</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:700;color:#2563eb}.container{max-width:1200px;margin:24px auto;padding:0 16px}.muted{color:#6b7280}.cards,.menu{display:grid;gap:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:24px 0}.menu{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card,.menu button{background:#fff;border:0;border-radius:12px;box-shadow:0 2px 8px #0000000d}.card{padding:20px}.card h3{margin:0 0 10px;font-size:15px}.number{font-size:32px;font-weight:700;color:#2563eb}.menu button{padding:22px;text-align:left;font-size:16px;cursor:pointer}.menu span{display:block;font-size:30px;margin-bottom:10px}.profile{display:flex;align-items:center;gap:8px}.modal-bg{position:fixed;inset:0;background:#0f172a59;z-index:10}.modal{position:fixed;z-index:11;top:3%;left:50%;transform:translateX(-50%);width:900px;max-width:96%;max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}.field,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#6b7280;color:#fff}.light{background:#f3f4f6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.row{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.table-wrap{overflow:auto}.planning{width:100%;border-collapse:collapse}.planning th,.planning td{padding:12px 10px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.planning th{background:#f9fafb}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px}.ok{background:#dcfce7;color:#166534}.wait{background:#fee2e2;color:#991b1b}@media(max-width:600px){header{padding:14px 16px}.logo{font-size:18px}.container{margin:18px auto}.cards{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr}.modal{top:2%;padding:16px}.filters,.grid2{grid-template-columns:1fr}.planning{font-size:13px}.planning th,.planning td{padding:9px 7px}.profile span{font-size:14px}}</style></head><body><header><div class="logo">Adept Pro Track Mate</div><div class="profile"><span id="profilLabel">Profil : Formateurs</span><button class="btn light" id="btnProfil">Changer</button></div></header><main class="container"><h1>Tableau de bord</h1><p class="muted">Gestion des plannings, tuteurs, nouveaux entrants et agences</p><section class="cards"><div class="card"><h3>Nouveaux entrants</h3><div class="number" id="compteurEntrants">0</div></div><div class="card"><h3>Tuteurs</h3><div class="number" id="compteurTuteurs">0</div></div><div class="card"><h3>Agences</h3><div class="number">7</div></div><div class="card"><h3>Plannings</h3><div class="number" id="compteurPlannings">0</div></div></section><section class="menu"><button id="btnEntrants"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button><button id="btnTuteurs"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button><button id="btnAgences"><span>🏢</span><strong>Agences</strong><br>Voir les agences partenaires</button><button id="btnPlanning"><span>📅</span><strong>Planning</strong><br>Organiser et suivre les accompagnements</button></section></main><footer style="text-align:center;color:#9ca3af;padding:35px">Adept Pro Track Mate</footer><script>
const AGENCES=['Dol de Bretagne','Mont de Marsan','Tarascon','Fleury Mérogis','Noisy le Gd','St Pierre de Chandieu','Vitry-en-Artois'];const FONCTIONS=['Conducteur','Aide-livreur','Technicien de quai','Autre'];const couleurs={'Dol de Bretagne':'#dbeafe','Mont de Marsan':'#dcfce7','Tarascon':'#fef3c7','Fleury Mérogis':'#fce7f3','Noisy le Gd':'#ede9fe','St Pierre de Chandieu':'#ffedd5','Vitry-en-Artois':'#cffafe'};
function lire(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function sauver(k,v){localStorage.setItem(k,JSON.stringify(v))}function profil(){return(localStorage.getItem('profilActuel')||'formateurs').toLowerCase().trim()}function estFormateur(){return['formateurs','master','master du site','master_site'].includes(profil())}function estRH(){return profil()==='rh, responsable d’agence'||profil()==='agence'}function agenceRH(){return localStorage.getItem('agenceRH')||''}function nomProfil(){if(estFormateur())return'Formateurs';if(estRH())return'RH, responsable d’agence'+(agenceRH()?' — '+agenceRH():'');return'Tuteur'}function ouvrir(id,html){fermer(id);const bg=document.createElement('div');bg.id=id+'Bg';bg.className='modal-bg';bg.onclick=()=>fermer(id);document.body.appendChild(bg);const m=document.createElement('div');m.id=id;m.className='modal';m.innerHTML=html;document.body.appendChild(m);return m}function fermer(id){const m=document.getElementById(id),b=document.getElementById(id+'Bg');if(m)m.remove();if(b)b.remove()}
function actualiser(){const e=lire('nouveauxEntrants'),a=lire('affectationsTuteurs');document.getElementById('compteurEntrants').textContent=estRH()&&agenceRH()?e.filter(x=>x.agence===agenceRH()).length:e.length;document.getElementById('compteurTuteurs').textContent=lire('tuteurs').length;document.getElementById('compteurPlannings').textContent=estRH()&&agenceRH()?a.filter(x=>x.agence===agenceRH()).length:a.length;document.getElementById('profilLabel').textContent='Profil : '+nomProfil();document.getElementById('btnTuteurs').style.display=estFormateur()?'':'none'}
function choisirProfil(){ouvrir('profilModal','<h2>🔐 Choisir le profil</h2><p class="muted">Le profil Formateurs a accès complet. Le profil RH est limité à une agence.</p><div class="actions"><button class="btn success" id="pFormateurs">Formateurs</button><button class="btn light" id="pRH">RH, responsable d’agence</button><button class="btn light" id="pTuteur">Tuteur</button></div><div class="actions"><button class="btn secondary" id="pClose">Fermer</button></div>');document.getElementById('pFormateurs').onclick=()=>setProfil('formateurs');document.getElementById('pRH').onclick=choisirAgenceRH;document.getElementById('pTuteur').onclick=()=>setProfil('tuteur');document.getElementById('pClose').onclick=()=>fermer('profilModal')}
function setProfil(p){localStorage.setItem('profilActuel',p);if(p!=='rh, responsable d’agence')localStorage.removeItem('agenceRH');fermer('profilModal');actualiser()}
function choisirAgenceRH(){const options=AGENCES.map(a=>'<option value="'+a+'">'+a+'</option>').join('');ouvrir('agenceRHModal','<h2>🏢 Choisir votre agence</h2><p class="muted">Un RH/responsable d’agence ne pourra gérer que les nouveaux entrants de cette agence.</p><select id="rhAgence" class="field"><option value="">-- Sélectionner l’agence --</option>'+options+'</select><div class="actions"><button class="btn primary" id="validerRH">Valider</button><button class="btn secondary" id="annulerRH">Annuler</button></div>');document.getElementById('validerRH').onclick=()=>{const a=document.getElementById('rhAgence').value;if(!a)return alert('Sélectionnez votre agence.');localStorage.setItem('profilActuel','rh, responsable d’agence');localStorage.setItem('agenceRH',a);fermer('agenceRHModal');fermer('profilModal');actualiser()};document.getElementById('annulerRH').onclick=()=>fermer('agenceRHModal')}
function afficherEntrants(){const tous=lire('nouveauxEntrants'),e=estRH()?tous.filter(x=>x.agence===agenceRH()):tous,a=lire('affectationsTuteurs');let h='<h2>👤 Nouveaux entrants</h2><p class="muted">'+(estRH()?'Agence : <strong>'+agenceRH()+'</strong> — vous ne pouvez gérer que cette agence.':'Liste complète des entrants enregistrés.')+'</p>';if(!e.length)h+='<div class="row">Aucun entrant enregistré pour cette agence.</div>';e.forEach((x)=>{const i=tous.indexOf(x),q=a.find(v=>v.entrantId===x.id);h+='<div class="row"><strong>'+x.nom+'</strong><p>📅 '+x.date+'<br>💼 '+x.fonction+'<br>🏢 '+x.agence+'<br>🎓 Tuteur : <strong>'+(q?q.tuteurNom:'Non affecté')+'</strong>'+(q?'<br>📆 '+q.dateDebut+' → '+q.dateFin:'')+'</p>'+(estFormateur()||estRH()?'<button class="btn danger" data-del-entrant="'+i+'">🗑️ Supprimer</button>':'')+'</div>'});h+='<div class="actions">'+(estFormateur()||estRH()?'<button class="btn primary" id="addEntrantBtn">➕ Ajouter</button>':'')+(estFormateur()?'<button class="btn success" id="affectBtn">🎓 Affecter un tuteur</button>':'')+'<button class="btn secondary" id="closeEntrants">Fermer</button></div>';ouvrir('entrantsModal',h);if(document.getElementById('addEntrantBtn'))document.getElementById('addEntrantBtn').onclick=()=>{fermer('entrantsModal');ajouterEntrant()};if(document.getElementById('affectBtn'))document.getElementById('affectBtn').onclick=()=>{fermer('entrantsModal');ouvrirAffectations()};document.getElementById('closeEntrants').onclick=()=>fermer('entrantsModal');document.querySelectorAll('[data-del-entrant]').forEach(b=>b.onclick=()=>supprimerEntrant(Number(b.dataset.delEntrant)))}
function ajouterEntrant(){const m=ouvrir('addEntrant','<h2>👤 Ajouter un nouvel entrant</h2>'+(estRH()?'<p class="muted">Agence imposée : <strong>'+agenceRH()+'</strong></p>':'')+'<label>Nom et prénom</label><input id="enNom" class="field" placeholder="Nom et prénom"><br><br><label>Date d’entrée</label><input id="enDate" class="field" type="date"><br><br><label>Fonction</label><div id="enFonctions" class="actions"></div><label>Agence</label><div id="enAgences"></div><div class="actions"><button class="btn primary" id="saveEntrant">Ajouter</button><button class="btn secondary" id="cancelEntrant">Annuler</button></div>');FONCTIONS.forEach(x=>{const b=document.createElement('button');b.className='btn light';b.textContent=x;b.onclick=()=>{m.querySelectorAll('#enFonctions button').forEach(z=>z.style.background='');b.style.background='#bfdbfe';m.dataset.fonction=x};m.querySelector('#enFonctions').appendChild(b)});AGENCES.forEach(x=>{if(estRH()&&x!==agenceRH())return;const b=document.createElement('button');b.className='btn light';b.style.display='block';b.style.width='100%';b.style.margin='6px 0';b.textContent=x;if(estRH()){b.style.background=couleurs[x]||'#e5e7eb';m.dataset.agence=x}else b.onclick=()=>{m.querySelectorAll('#enAgences button').forEach(z=>z.style.background='');b.style.background=couleurs[x]||'#e5e7eb';m.dataset.agence=x};m.querySelector('#enAgences').appendChild(b)});document.getElementById('saveEntrant').onclick=()=>{const nom=document.getElementById('enNom').value.trim(),date=document.getElementById('enDate').value;if(!nom||!date||!m.dataset.fonction||!m.dataset.agence)return alert('Renseignez le nom, la date, la fonction et l’agence.');if(estRH()&&m.dataset.agence!==agenceRH())return alert('Vous ne pouvez ajouter un entrant que pour votre agence : '+agenceRH()+'.');const e=lire('nouveauxEntrants');e.push({id:String(Date.now()),nom,date,fonction:m.dataset.fonction,agence:m.dataset.agence});sauver('nouveauxEntrants',e);fermer('addEntrant');actualiser();afficherEntrants()};document.getElementById('cancelEntrant').onclick=()=>fermer('addEntrant')}
function supprimerEntrant(i){if(!(estFormateur()||estRH()))return alert('Accès refusé.');const e=lire('nouveauxEntrants');const x=e[i];if(estRH()&&(!x||x.agence!==agenceRH()))return alert('Vous ne pouvez supprimer que les entrants de votre agence : '+agenceRH()+'.');if(!confirm('Supprimer cet entrant ?'))return;const id=x?.id;e.splice(i,1);sauver('nouveauxEntrants',e);if(id)sauver('affectationsTuteurs',lire('affectationsTuteurs').filter(a=>a.entrantId!==id));actualiser();afficherEntrants()}
function ouvrirTuteurs(){if(!estFormateur())return alert('Accès réservé aux Formateurs.');let h='<h2>🎓 Gestion des tuteurs</h2><input id="tuNom" class="field" placeholder="Nom et prénom"><div class="actions"><button class="btn primary" id="addTuteur">➕ Ajouter le tuteur</button></div><hr><h3>Tuteurs enregistrés</h3>';const t=lire('tuteurs');if(!t.length)h+='<p>Aucun tuteur enregistré.</p>';t.forEach((x,i)=>h+='<div class="row"><strong>👤 '+x.nom+'</strong><button class="btn danger" data-del-tuteur="'+i+'" style="float:right">🗑️</button></div>');h+='<div class="actions"><button class="btn success" id="openAffect">🎓 Affecter un tuteur à un entrant</button><button class="btn secondary" id="closeTuteurs">Fermer</button></div>';ouvrir('tuteursModal',h);document.getElementById('addTuteur').onclick=ajouterTuteur;document.getElementById('openAffect').onclick=()=>{fermer('tuteursModal');ouvrirAffectations()};document.getElementById('closeTuteurs').onclick=()=>fermer('tuteursModal');document.querySelectorAll('[data-del-tuteur]').forEach(b=>b.onclick=()=>supprimerTuteur(Number(b.dataset.delTuteur)))}
function ajouterTuteur(){if(!estFormateur())return alert('Accès réservé aux Formateurs.');const n=document.getElementById('tuNom').value.trim();if(!n)return alert('Renseignez le nom.');const t=lire('tuteurs');if(t.some(x=>x.nom.toLowerCase()===n.toLowerCase()))return alert('Ce tuteur existe déjà.');t.push({id:String(Date.now()),nom:n});sauver('tuteurs',t);actualiser();ouvrirTuteurs()}function supprimerTuteur(i){if(!estFormateur())return alert('Accès réservé aux Formateurs.');const t=lire('tuteurs');if(!confirm('Supprimer ce tuteur ?'))return;t.splice(i,1);sauver('tuteurs',t);actualiser();ouvrirTuteurs()}
function ouvrirAffectations(){if(!estFormateur())return alert('Accès réservé aux Formateurs.');const e=lire('nouveauxEntrants'),t=lire('tuteurs'),a=lire('affectationsTuteurs');let h='<h2>🎓 Affectation des tuteurs</h2>';e.forEach(x=>{const q=a.find(v=>v.entrantId===x.id);h+='<div class="row"><strong>'+x.nom+'</strong><p>'+x.date+' · '+x.agence+' · '+x.fonction+'</p><select id="sel-'+x.id+'" class="field"><option value="">-- Aucun tuteur --</option>'+t.map(z=>'<option value="'+z.id+'" '+(q&&q.tuteurId===z.id?'selected':'')+'>'+z.nom+'</option>').join('')+'</select><div class="grid2"><input id="deb-'+x.id+'" class="field" type="date" value="'+(q?q.dateDebut:x.date)+'"><input id="fin-'+x.id+'" class="field" type="date" value="'+(q?q.dateFin:x.date)+'"></div><div class="actions"><button class="btn success" data-save-aff="'+x.id+'">💾 Enregistrer</button>'+(q?'<button class="btn danger" data-rem-aff="'+x.id+'">Retirer</button>':'')+'</div></div>'});h+='<button class="btn secondary" id="closeAffect">Fermer</button>';ouvrir('affectationsModal',h);document.getElementById('closeAffect').onclick=()=>fermer('affectationsModal');document.querySelectorAll('[data-save-aff]').forEach(b=>b.onclick=()=>enregistrerAffectation(b.dataset.saveAff));document.querySelectorAll('[data-rem-aff]').forEach(b=>b.onclick=()=>retirerAffectation(b.dataset.remAff))}
function enregistrerAffectation(id){if(!estFormateur())return alert('Accès réservé aux Formateurs.');const s=document.getElementById('sel-'+id),deb=document.getElementById('deb-'+id).value,fin=document.getElementById('fin-'+id).value;if(!s||!s.value)return retirerAffectation(id);if(!deb||!fin)return alert('Renseignez les dates.');if(fin<deb)return alert('La fin doit être postérieure ou égale au début.');const e=lire('nouveauxEntrants').find(x=>x.id===id),t=lire('tuteurs').find(x=>x.id===s.value);if(!e||!t)return alert('Entrant ou tuteur introuvable.');const a=lire('affectationsTuteurs').filter(x=>x.entrantId!==id);a.push({entrantId:id,tuteurId:t.id,tuteurNom:t.nom,dateDebut:deb,dateFin:fin,agence:e.agence});sauver('affectationsTuteurs',a);actualiser();ouvrirAffectations()}function retirerAffectation(id){if(!estFormateur())return alert('Accès réservé aux Formateurs.');sauver('affectationsTuteurs',lire('affectationsTuteurs').filter(x=>x.entrantId!==id));actualiser();ouvrirAffectations()}
function ouvrirAgences(){ouvrir('agencesModal','<h2>🏢 Agences</h2>'+AGENCES.map(x=>'<div class="row">🏢 '+x+'</div>').join('')+'<button class="btn secondary" id="closeAgences">Fermer</button>');document.getElementById('closeAgences').onclick=()=>fermer('agencesModal')}
function ouvrirPlanning(){const tous=lire('nouveauxEntrants'),e=estRH()?tous.filter(x=>x.agence===agenceRH()):tous,a=lire('affectationsTuteurs'),t=lire('tuteurs');let h='<h2>📅 Planning</h2>'+(estRH()?'<p class="muted">Agence : <strong>'+agenceRH()+'</strong></p>':'');h+='<div class="filters"><select id="filtreAgence" class="field"><option value="">Toutes les agences</option>'+AGENCES.map(x=>'<option>'+x+'</option>').join('')+'</select><select id="filtreTuteur" class="field"><option value="">Tous les tuteurs</option>'+t.map(x=>'<option value="'+x.id+'">'+x.nom+'</option>').join('')+'</select></div><div id="planningZone"></div><button class="btn secondary" id="closePlanning">Fermer</button>';ouvrir('planningModal',h);if(estRH()){document.getElementById('filtreAgence').value=agenceRH();document.getElementById('filtreAgence').disabled=true}document.getElementById('filtreAgence').onchange=rafraichirPlanning;document.getElementById('filtreTuteur').onchange=rafraichirPlanning;document.getElementById('closePlanning').onclick=()=>fermer('planningModal');rafraichirPlanning()}
function rafraichirPlanning(){const tous=lire('nouveauxEntrants'),e=estRH()?tous.filter(x=>x.agence===agenceRH()):tous,ag=document.getElementById('filtreAgence')?.value||'',tu=document.getElementById('filtreTuteur')?.value||'',a=lire('affectationsTuteurs');const rows=e.filter(x=>(!ag||x.agence===ag)&&(!tu||a.some(q=>q.entrantId===x.id&&q.tuteurId===tu))).map(x=>{const q=a.find(v=>v.entrantId===x.id);return '<tr><td><strong>'+x.nom+'</strong><br>'+x.date+'</td><td>'+x.agence+'</td><td>'+x.fonction+'</td><td>'+(q?'<span class="badge ok">'+q.tuteurNom+'</span>':'<span class="badge wait">Non affecté</span>')+'</td><td>'+(q?q.dateDebut+' → '+q.dateFin:'À programmer')+'</td></tr>'}).join('');document.getElementById('planningZone').innerHTML='<div class="table-wrap"><table class="planning"><thead><tr><th>Entrant</th><th>Agence</th><th>Fonction</th><th>Tuteur</th><th>Accompagnement</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5">Aucun résultat.</td></tr>')+'</tbody></table></div>'}
document.getElementById('btnProfil').onclick=choisirProfil;document.getElementById('btnEntrants').onclick=afficherEntrants;document.getElementById('btnTuteurs').onclick=ouvrirTuteurs;document.getElementById('btnAgences').onclick=ouvrirAgences;document.getElementById('btnPlanning').onclick=ouvrirPlanning;actualiser();
</script></body></html>
