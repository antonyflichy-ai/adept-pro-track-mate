<!DOCTYPE html>
<html lang="fr">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adept Pro Track Mate</title>
   <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 16px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      color: #2563eb;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .menu button {
      border: none;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: left;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .menu button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .menu span {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }

    footer {
      text-align: center;
      color: #9ca3af;
      padding: 40px 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Adept Pro Track Mate</div>
    <div>Gestion des plannings</div>
  </header>

  <main class="container">

    <h1>Tableau de bord</h1>

    <p class="subtitle">
      Gestion des plannings, tuteurs, nouveaux entrants et agences
    </p>

    <section class="cards">

      <div class="card">
        <h3>Nouveaux entrants</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Tuteurs</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Agences</h3>
        <div class="number">0</div>
      </div>

      <div class="card">
        <h3>Plannings</h3>
        <div class="number">0</div>
      </div>

    </section>

    <section class="menu">

      <button onclick="afficherNouveauxEntrants()">
        <span>👤</span>
        <strong>Nouveaux entrants</strong>
        <br>
        Ajouter et gérer les nouveaux entrants
      </button>

      <button onclick="alert('Module Tuteurs')">
        <span>🎓</span>
        <strong>Tuteurs</strong>
        <br>
        Gérer les tuteurs disponibles
      </button>

      <button onclick="ouvrirAgences()">
    <span>🏢</span>
    <strong>Agences</strong>
    <br>
    Gérer les agences partenaires
</button>
<div id="nouvelEntrant" style="display:none;">

  <h3>Ajouter un nouvel entrant</h3>

  <label>Nom et prénom :</label>
  <input type="text" id="nomEntrant" placeholder="Nom et prénom">

  <br><br>

  <label>Date d'entrée :</label>
  <input type="date" id="dateEntree">

  <br><br>

  <label>Fonction :</label>
  <select id="fonctionEntrant">
    <option value="">-- Choisir une fonction --</option>
    <option>Aide-livreur</option>
    <option>Conducteur</option>
    <option>Conducteur PL</option>
    <option>Manutentionnaire</option>
    <option>technicien de quai</option>
  </select>

  <br><br>

  <label>Agence :</label>
  <select id="agenceEntrant">
    <option value="">-- Choisir une agence --</option>
    <option>Dol de Bretagne</option>
    <option>Mont de Marsan</option>
    <option>Tarascon</option>
    <option>Fleury Merogis</option>
    <option>Noisy le Gd</option>
    <option>St Pierre de Chandieu</option>
    <option>Vitry-en-Artois</option>
  </select>

  <br><br>

  <button onclick="ajouterEntrant()">Ajouter le nouvel entrant</button>

</div>
<div id="choixAgences" style="display:none;">
    <h3>Sélectionner une agence</h3>

   <button onclick="selectionnerAgence('Dol de Bretagne')">
    Dol de Bretagne
</button>

<button onclick="selectionnerAgence('Mont de Marsan')">
    Mont de Marsan
</button>

<button onclick="selectionnerAgence('Tarascon')">
    Tarascon
</button>

<button onclick="selectionnerAgence('Fleury Mérogis')">
    Fleury Mérogis
</button>

<button onclick="selectionnerAgence('Noisy le Gd')">
    Noisy le Gd
</button>

<button onclick="selectionnerAgence('St Pierre de Chandieu')">
    St Pierre de Chandieu
</button>

<button onclick="selectionnerAgence('Vitry-en-Artois')">
    Vitry-en-Artois
</button>

    <p id="agenceSelectionnee"></p>
</div>

      <button onclick="ouvrirPlanning()">
        <span>📅</span>
        <strong>Planning</strong>
        <br>
        Organiser et suivre les plannings
      </button>

    </section>

  </main>

  <footer>
    Adept Pro Track Mate
  </footer>
<script>
function ouvrirNouveauxEntrants() {

    const agences = [
        "Dol de Bretagne",
        "Mont de Marsan",
        "Tarascon",
        "Fleury Mérogis",
        "Noisy le Grand",
        "St Pierre de Chandieu",
        "Vitry-en-Artois"
    ];

    const fonctions = [
        "Conducteur",
        "Aide-livreur",
        "Technicien de quai",
        "Autre"
    ];

    const ancienneFenetre = document.getElementById("formNouvelEntrant");
    if (ancienneFenetre) {
        ancienneFenetre.remove();
    }

    const fenetre = document.createElement("div");
    fenetre.id = "formNouvelEntrant";

    fenetre.style.position = "fixed";
    fenetre.style.top = "50%";
    fenetre.style.left = "50%";
    fenetre.style.transform = "translate(-50%, -50%)";
    fenetre.style.background = "white";
    fenetre.style.padding = "30px";
    fenetre.style.borderRadius = "15px";
    fenetre.style.boxShadow = "0 10px 40px rgba(0,0,0,0.3)";
    fenetre.style.zIndex = "9999";
    fenetre.style.width = "420px";
    fenetre.style.maxWidth = "90%";

    fenetre.innerHTML = `
        <h2>Ajouter un nouvel entrant</h2>

        <label><strong>Nom et prénom</strong></label>
        <input id="nomEntrant" type="text"
               placeholder="Nom et prénom"
               style="width:100%; padding:10px; margin:8px 0 15px;">

        <label><strong>Date d'entrée</strong></label>
        <input id="dateEntrant" type="date"
               style="width:100%; padding:10px; margin:8px 0 15px;">

        <label><strong>Fonction</strong></label>

        <div id="fonctionsEntrant" style="margin:10px 0 20px;">
            ${fonctions.map(fonction => `
                <label style="display:block; margin:8px 0;">
                    <input type="checkbox" value="${fonction}">
                    ${fonction}
                </label>
            `).join("")}
        </div>

        <label><strong>Agence</strong></label>

        <div id="agencesEntrant" style="margin-top:10px;">
            ${agences.map(agence => `
                <button type="button"
                        data-agence="${agence}"
                        style="
                            display:block;
                            width:100%;
                            padding:10px;
                            margin:6px 0;
                            border:1px solid #ccc;
                            border-radius:8px;
                            background:#f5f5f5;
                            cursor:pointer;
                            text-align:left;
                        ">
                    ${agence}
                </button>
            `).join("")}
        </div>

        <p id="agenceChoisie"
           style="font-weight:bold; margin-top:15px;">
            Aucune agence sélectionnée
        </p>

        <div style="margin-top:20px; text-align:right;">
            <button id="annulerEntrant"
                    style="
                        padding:10px 15px;
                        margin-right:8px;
                        border:0;
                        border-radius:8px;
                        cursor:pointer;
                    ">
                Annuler
            </button>

            <button id="validerEntrant"
                    style="
                        padding:10px 15px;
                        border:0;
                        border-radius:8px;
                        background:#2563eb;
                        color:white;
                        cursor:pointer;
                    ">
                Ajouter
            </button>
        </div>
    `;

    document.body.appendChild(fenetre);

    let agenceSelectionnee = "";

    document.querySelectorAll("#agencesEntrant button").forEach(bouton => {

        bouton.addEventListener("click", function() {

            agenceSelectionnee = this.dataset.agence;

            document.querySelectorAll("#agencesEntrant button").forEach(b => {
                b.style.background = "#f5f5f5";
                b.style.color = "black";
            });

            this.style.background = "#2563eb";
            this.style.color = "white";

            document.getElementById("agenceChoisie").textContent =
                "Agence sélectionnée : " + agenceSelectionnee;
        });
    });

    document.getElementById("annulerEntrant").addEventListener("click", function() {
        fenetre.remove();
    });
}
    function ouvrirNouveauxEntrants() {

    const fonctions = [
        "Conducteur",
        "Aide-livreur",
        "Technicien de quai",
        "Autre"
    ];

    const agences = [
        "Dol de Bretagne",
        "Mont de Marsan",
        "Tarascon",
        "Fleury Merogis",
        "Noisy le Gd",
        "St Pierre de Chandieu",
        "Vitry-en-Artois"
    ];

    const couleurs = {
        "Dol de Bretagne": "#dbeafe",
        "Mont de Marsan": "#dcfce7",
        "Tarascon": "#fef3c7",
        "Fleury Merogis": "#fce7f3",
        "Noisy le Gd": "#ede9fe",
        "St Pierre de Chandieu": "#ffedd5",
        "Vitry-en-Artois": "#cffafe"
    };

    const formulaire = document.createElement("div");

    formulaire.style.position = "fixed";
    formulaire.style.top = "5%";
formulaire.style.left = "50%";
formulaire.style.transform = "translateX(-50%)";
formulaire.style.maxHeight = "90vh";
formulaire.style.overflowY = "auto";
    formulaire.style.background = "white";
    formulaire.style.padding = "30px";
    formulaire.style.borderRadius = "15px";
    formulaire.style.boxShadow = "0 10px 40px rgba(0,0,0,0.3)";
    formulaire.style.width = "450px";
    formulaire.style.maxWidth = "90%";
    formulaire.style.zIndex = "9999";

    formulaire.innerHTML = `
        <h2>Ajouter un nouvel entrant</h2>

        <label><strong>Nom et prénom</strong></label>
        <input id="nouvelEntrantNom"
               type="text"
               placeholder="Nom et prénom"
               style="width:100%;padding:10px;margin:8px 0 18px;">

        <label><strong>Date d'entrée</strong></label>
        <input id="nouvelEntrantDate"
               type="date"
               style="width:100%;padding:10px;margin:8px 0 18px;">

        <label><strong>Fonction</strong></label>

        <div id="choixFonction"
             style="margin:10px 0 18px;">
        </div>

        <label><strong>Agence</strong></label>

        <div id="choixAgence"
             style="margin:10px 0 20px;">
        </div>

        <button id="validerNouvelEntrant"
                style="padding:12px 20px;
                       border:0;
                       border-radius:8px;
                       background:#2563eb;
                       color:white;
                       cursor:pointer;">
            Ajouter
        </button>

        <button id="annulerNouvelEntrant"
                style="padding:12px 20px;
                       margin-left:10px;
                       border:0;
                       border-radius:8px;
                       cursor:pointer;">
            Annuler
        </button>
    `;

    document.body.appendChild(formulaire);

    const choixFonction =
        formulaire.querySelector("#choixFonction");

    fonctions.forEach(function(fonction) {

        const bouton = document.createElement("button");

        bouton.textContent = fonction;

        bouton.type = "button";

        bouton.style.padding = "10px 15px";
        bouton.style.margin = "4px";
        bouton.style.borderRadius = "8px";
        bouton.style.border = "1px solid #ccc";
        bouton.style.background = "white";
        bouton.style.cursor = "pointer";

        bouton.onclick = function() {

            formulaire
                .querySelectorAll(".fonctionChoisie")
                .forEach(function(b) {
                    b.classList.remove("fonctionChoisie");
                    b.style.background = "white";
                });

            bouton.classList.add("fonctionChoisie");
            bouton.style.background = "#bfdbfe";
        };

        choixFonction.appendChild(bouton);
    });

    const choixAgence =
        formulaire.querySelector("#choixAgence");

    agences.forEach(function(agence) {

        const bouton = document.createElement("button");

        bouton.textContent = agence;

        bouton.type = "button";

        bouton.style.display = "block";
        bouton.style.width = "100%";
        bouton.style.padding = "11px";
        bouton.style.margin = "5px 0";
        bouton.style.borderRadius = "8px";
        bouton.style.border = "1px solid #ccc";
        bouton.style.background = "white";
        bouton.style.cursor = "pointer";
        bouton.style.textAlign = "left";

        bouton.onclick = function() {

            formulaire
                .querySelectorAll(".agenceChoisie")
                .forEach(function(b) {
                    b.classList.remove("agenceChoisie");
                    b.style.background = "white";
                });

            bouton.classList.add("agenceChoisie");

            bouton.style.background = couleurs[agence];
        };

        choixAgence.appendChild(bouton);
    });

    formulaire
        .querySelector("#annulerNouvelEntrant")
        .onclick = function() {
            formulaire.remove();
        };

    formulaire
        .querySelector("#validerNouvelEntrant")
        .onclick = function() {

            const nom =
                formulaire
                    .querySelector("#nouvelEntrantNom")
                    .value.trim();

            const date =
                formulaire
                    .querySelector("#nouvelEntrantDate")
                    .value;

            const fonctionBouton =
                formulaire.querySelector(".fonctionChoisie");

            const agenceBouton =
                formulaire.querySelector(".agenceChoisie");

            if (!nom) {
                alert("Merci de renseigner le nom et prénom.");
                return;
            }

            if (!date) {
                alert("Merci de sélectionner la date d'entrée.");
                return;
            }

            if (!fonctionBouton) {
                alert("Merci de sélectionner une fonction.");
                return;
            }

            if (!agenceBouton) {
                alert("Merci de sélectionner une agence.");
                return;
            }

            const fonction =
                fonctionBouton.textContent;

            const agence =
                agenceBouton.textContent;

            const nouvelEntrant = {
                nom: nom,
                date: date,
                fonction: fonction,
                agence: agence
            };

            let entrants =
                JSON.parse(
                    localStorage.getItem("nouveauxEntrants") || "[]"
                );

            entrants.push(nouvelEntrant);

            localStorage.setItem(
                "nouveauxEntrants",
                JSON.stringify(entrants)
            );

            formulaire.remove();

            alert(
                "Nouvel entrant ajouté !\n\n" +
                "Nom : " + nom + "\n" +
                "Date d'entrée : " + date + "\n" +
                "Fonction : " + fonction + "\n" +
                "Agence : " + agence
            );

            const compteur =
                document.querySelectorAll(".number")[0];

            if (compteur) {
                compteur.textContent = entrants.length;
            }
        };
}
 function afficherNouveauxEntrants() {

    const entrants = JSON.parse(
        localStorage.getItem("nouveauxEntrants") || "[]"
    );

    if (entrants.length === 0) {
    ouvrirNouveauxEntrants();
    return;
}

    let message = "NOUVEAUX ENTRANTS\n\n";

    entrants.forEach(function(entrant, index) {

        message +=
            (index + 1) + ". " +
            entrant.nom + "\n" +
            "Date d'entrée : " + entrant.date + "\n" +
            "Fonction : " + entrant.fonction + "\n" +
            "Agence : " + entrant.agence + "\n\n";
    });

    alert(message);
  if (confirm("Voulez-vous ajouter un nouvel entrant ?")) {
    ouvrirNouveauxEntrants();
}}
function function ouvrirTuteurs() {

    const tuteurs = JSON.parse(
        localStorage.getItem("tuteurs") || "[]"
    );

    let contenu = `
        <h2>👥 Gestion des tuteurs</h2>

        <label><strong>Nom et prénom du tuteur</strong></label>

        <input
            id="nomNouveauTuteur"
            type="text"
            placeholder="Nom et prénom"
            style="
                width:100%;
                padding:10px;
                margin:10px 0 15px;
                box-sizing:border-box;
            "
        >

        <button
            onclick="ajouterTuteur()"
            style="
                padding:10px 18px;
                border:0;
                border-radius:8px;
                background:#2563eb;
                color:white;
                cursor:pointer;
            "
        >
            ➕ Ajouter le tuteur
        </button>

        <hr style="margin:20px 0;">

        <h3>Tuteurs enregistrés</h3>

        <div id="listeTuteurs">
    `;

    if (tuteurs.length === 0) {

        contenu += `
            <p>Aucun tuteur enregistré.</p>
        `;

    } else {

        tuteurs.forEach(function(tuteur, index) {

            contenu += `
                <div style="
                    border:1px solid #ddd;
                    border-radius:10px;
                    padding:12px;
                    margin:8px 0;
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                ">

                    <strong>👤 ${tuteur.nom}</strong>

                    <button
                        onclick="supprimerTuteur(${index})"
                        style="
                            padding:7px 10px;
                            border:0;
                            border-radius:6px;
                            background:#dc2626;
                            color:white;
                            cursor:pointer;
                        "
                    >
                        🗑️
                    </button>

                </div>
            `;
        });
    }
function ajouterTuteur() {

    const champ = document.getElementById("nomNouveauTuteur");

    if (!champ) {
        return;
    }

    const nom = champ.value.trim();

    if (!nom) {
        alert("Merci de renseigner le nom et prénom du tuteur.");
        return;
    }

    let tuteurs = JSON.parse(
        localStorage.getItem("tuteurs") || "[]"
    );

    tuteurs.push({
        nom: nom
    });

    localStorage.setItem(
        "tuteurs",
        JSON.stringify(tuteurs)
    );

    alert("Tuteur ajouté : " + nom);

    document.getElementById("fenetreTuteurs").remove();

    ouvrirTuteurs();
}


function supprimerTuteur(index) {

    let tuteurs = JSON.parse(
        localStorage.getItem("tuteurs") || "[]"
    );

    if (!confirm("Voulez-vous supprimer ce tuteur ?")) {
        return;
    }

    tuteurs.splice(index, 1);

    localStorage.setItem(
        "tuteurs",
        JSON.stringify(tuteurs)
    );

    document.getElementById("fenetreTuteurs").remove();

    ouvrirTuteurs();
}


function fermerFenetreTuteurs() {

    const fenetre =
        document.getElementById("fenetreTuteurs");

    if (fenetre) {
        fenetre.remove();
    }
}
    contenu += `
        </div>

        <br>

        <button
            onclick="fermerFenetreTuteurs()"
            style="
                padding:10px 18px;
                border:0;
                border-radius:8px;
                background:#6b7280;
                color:white;
                cursor:pointer;
            "
        >
            Fermer
        </button>
    `;

    const fenetre = document.createElement("div");

    fenetre.id = "fenetreTuteurs";

    fenetre.style.position = "fixed";
    fenetre.style.top = "5%";
    fenetre.style.left = "50%";
    fenetre.style.transform = "translateX(-50%)";
    fenetre.style.background = "white";
    fenetre.style.padding = "30px";
    fenetre.style.borderRadius = "15px";
    fenetre.style.boxShadow = "0 10px 40px rgba(0,0,0,0.3)";
    fenetre.style.width = "500px";
    fenetre.style.maxWidth = "90%";
    fenetre.style.maxHeight = "90vh";
    fenetre.style.overflowY = "auto";
    fenetre.style.zIndex = "99999";

    fenetre.innerHTML = contenu;

    document.body.appendChild(fenetre);
} 
    alert("Module Tuteurs");
}

function ouvrirAgences() {
    document.getElementById("choixAgences").style.display = "block";
}

function selectionnerAgence(nom) {
    document.getElementById("agenceSelectionnee").textContent =
        "Agence sélectionnée : " + nom;
}

function ouvrirPlanning() {
    alert("Module Planning");
}
 function afficherListeNouveauxEntrants() {

    const entrants = JSON.parse(

                        📅 Date d'entrée : ${entrant.date}<br>
                        💼 Fonction : ${entrant.fonction}<br>
                        🏢 Agence : ${entrant.agence}
                    </p>

                    <button
                        onclick="supprimerNouvelEntrant(${index})"
                        style="
                            padding:8px 12px;
                            border:0;
                            border-radius:6px;
                            background:#dc2626;
                            color:white;
                            cursor:pointer;
                        ">
                        🗑️ Supprimer
                    </button>

                </div>
            `;
        });
    }

    contenu += `
        <button
            onclick="document.getElementById('listeNouveauxEntrants').remove()"
            style="
                padding:10px 18px;
                border:0;
                border-radius:8px;
                background:#2563eb;
                color:white;
                cursor:pointer;
            ">
            Fermer
        </button>
    `;

    fenetre.innerHTML = contenu;

    document.body.appendChild(fenetre);
}


function supprimerNouvelEntrant(index) {

    const entrants = JSON.parse(
        localStorage.getItem("nouveauxEntrants") || "[]"
    );

    if (!confirm("Voulez-vous supprimer cet entrant ?")) {
        return;
    }

    entrants.splice(index, 1);

    localStorage.setItem(
        "nouveauxEntrants",
        JSON.stringify(entrants)
    );

    afficherListeNouveauxEntrants();

    const compteur =
        document.querySelectorAll(".number")[0];

    if (compteur) {
        compteur.textContent = entrants.length;
    }
}
 function afficherListeNouveauxEntrants() {

    const entrants = JSON.parse(
        localStorage.getItem("nouveauxEntrants") || "[]"
    );

    const ancienneFenetre =
        document.getElementById("listeNouveauxEntrants");

    if (ancienneFenetre) {
        ancienneFenetre.remove();
    }

    const fenetre = document.createElement("div");

    fenetre.id = "listeNouveauxEntrants";

    fenetre.style.position = "fixed";
    fenetre.style.top = "50%";
    fenetre.style.left = "50%";
    fenetre.style.transform = "translate(-50%, -50%)";
    fenetre.style.background = "white";
    fenetre.style.padding = "30px";
    fenetre.style.borderRadius = "15px";
    fenetre.style.boxShadow = "0 10px 40px rgba(0,0,0,0.3)";
    fenetre.style.width = "600px";
    fenetre.style.maxWidth = "90%";
    fenetre.style.maxHeight = "80vh";
    fenetre.style.overflowY = "auto";
    fenetre.style.zIndex = "10000";

    let contenu = `
        <h2>👤 Nouveaux entrants</h2>
    `;

    if (entrants.length === 0) {

        contenu += `
            <p>Aucun nouvel entrant enregistré.</p>
        `;

    } else {

        entrants.forEach(function(entrant, index) {

            contenu += `
                <div style="
                    border:1px solid #ddd;
                    border-radius:10px;
                    padding:15px;
                    margin:10px 0;
                ">

                    <strong>${entrant.nom}</strong>

                    <br>
                    📅 Date d'entrée : ${entrant.date}

                    <br>
                    💼 Fonction : ${entrant.fonction}

                    <br>
                    🏢 Agence : ${entrant.agence}

                    <br><br>

                    <button
                        onclick="supprimerNouvelEntrant(${index})"
                        style="
                            padding:8px 12px;
                            border:0;
                            border-radius:6px;
                            background:#dc2626;
                            color:white;
                            cursor:pointer;
                        "
                    >
                        Supprimer
                    </button>

                </div>
            `;
        });
    }

    contenu += `
        <br>

        <button
            id="fermerListeEntrants"
            style="
                padding:10px 18px;
                border:0;
                border-radius:8px;
                background:#2563eb;
                color:white;
                cursor:pointer;
            "
        >
            Fermer
        </button>
    `;

    fenetre.innerHTML = contenu;

    document.body.appendChild(fenetre);

    document
        .getElementById("fermerListeEntrants")
        .onclick = function() {
            fenetre.remove();
        };
}


function supprimerNouvelEntrant(index) {

    const entrants = JSON.parse(
        localStorage.getItem("nouveauxEntrants") || "[]"
    );

    if (!confirm("Voulez-vous vraiment supprimer cet entrant ?")) {
        return;
    }

    entrants.splice(index, 1);

    localStorage.setItem(
        "nouveauxEntrants",
        JSON.stringify(entrants)
    );

    const compteur =
        document.querySelectorAll(".number")[0];

    if (compteur) {
        compteur.textContent = entrants.length;
    }

    afficherListeNouveauxEntrants();
}
</script>
</body>
</html>
